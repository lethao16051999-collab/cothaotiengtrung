<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Trang luyện viết HSK6 3.0 · Phần 1 (viết đoạn văn ứng dụng). Mở từ "Ôn luyện theo bài" trên trang chính.
     Sửa nội dung: sửa mảng LOAI (nội dung), PRIO (xếp hạng khả năng ra thi), DICH (bản dịch) trong script bên dưới. -->
<title>Luyện viết HSK6 3.0 – Cô Thảo tiếng Trung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* Layout: sidebar thư mục bên trái (thu thành thanh cuộn ngang trên điện thoại), nội dung 5 phần bên phải; ô luyện viết kẻ ô vuông kiểu phiếu trả lời HSK */
:root{
  --bg:#FBF7F1; --surface:#FFFFFF; --sunk:#F4ECE2; --line:#E6D8C8;
  --fg:#2B1A1F; --muted:#76656A; --plum:#7A1F3D; --plum-soft:#F3E3E8;
  --gold:#B8862A; --gold-soft:#F7EBD2; --ok:#2F7A4F; --grid:#E9C9D3;
  --f-display:"Noto Serif SC","Songti SC",serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181214; --surface:#221A1D; --sunk:#1D1518; --line:#3A2C31;
  --fg:#F1E7E1; --muted:#B3A1A6; --plum:#E58AA6; --plum-soft:#3A2129;
  --gold:#E2B55A; --gold-soft:#3A2F1A; --ok:#6CC795; --grid:#4A2E37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181214; --surface:#221A1D; --sunk:#1D1518; --line:#3A2C31;
  --fg:#F1E7E1; --muted:#B3A1A6; --plum:#E58AA6; --plum-soft:#3A2129;
  --gold:#E2B55A; --gold-soft:#3A2F1A; --ok:#6CC795; --grid:#4A2E37; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65}
.zh{font-family:var(--f-zh)}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1240px;margin:0 auto;gap:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}

/* Sidebar */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.brand b{font-size:19px;font-weight:700;color:var(--plum)}
.folder{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.folder-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--plum-soft);border-bottom:1px solid var(--line)}
.folder-head svg{flex:none;color:var(--plum)}
.folder-head div{display:flex;flex-direction:column;line-height:1.3}
.folder-head strong{font-size:14px}
.folder-head span{font-size:12px;color:var(--muted)}
.nav{list-style:none;margin:0;padding:6px}
.nav a{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 10px;border-radius:7px;color:var(--fg);text-decoration:none}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--plum);color:#fff}
.nav a[aria-current="page"] .n,.nav a[aria-current="page"] .vi{color:#fff;opacity:.85}
.nav .vol{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;padding:10px 10px 4px}
.nav .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .t{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.nav .t .zh{font-size:15px;font-weight:500}
.nav .t .vi{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.nav a[aria-current="page"] .pill{background:rgba(255,255,255,.2);color:#fff}
.folder-soon{padding:10px 14px;font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

/* Main */
main{min-width:0;display:flex;flex-direction:column;gap:28px}
.head{display:flex;flex-direction:column;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.crumb{font-size:12.5px;color:var(--muted)}
.crumb b{color:var(--gold);font-weight:600}
.head h1{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;text-wrap:balance}
.head h1 .zh-title{font-family:var(--f-display);font-size:40px;font-weight:700;color:var(--plum);line-height:1.15}
.head h1 .vi-title{font-size:20px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.chip.gold{background:var(--gold-soft);border-color:transparent;color:var(--fg)}

.toc{display:flex;flex-wrap:wrap;gap:8px}
.toc a{font-size:13px;text-decoration:none;color:var(--fg);padding:6px 12px;border-radius:7px;background:var(--surface);border:1px solid var(--line);display:flex;gap:6px;align-items:center}
.toc a:hover{border-color:var(--plum)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--ok)}

section.part{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 16px;scroll-margin-top:20px}
.pno{font-family:var(--f-display);font-size:30px;color:var(--gold);line-height:1;padding-top:2px;font-variant-numeric:tabular-nums}
.pbody{min-width:0;display:flex;flex-direction:column;gap:12px}
.pbody h2{margin:0;font-size:19px;font-weight:700;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.pbody h2 small{font-size:13px;font-weight:500;color:var(--muted)}
.pbody p{margin:0;max-width:68ch}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.type{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.type .zh{font-weight:500;color:var(--plum);font-size:15.5px}
.type span{font-size:13.5px;color:var(--muted)}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

.pending{border:1.5px dashed var(--line);border-radius:10px;padding:18px;display:flex;gap:14px;align-items:flex-start;background:var(--sunk)}
.pending svg{flex:none;color:var(--gold);margin-top:2px}
.pending div{display:flex;flex-direction:column;gap:4px}
.pending b{font-size:14px}
.pending span{font-size:13.5px;color:var(--muted);max-width:60ch}

/* Practice */
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.prompt-top{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.prompt-top .label{color:var(--gold)}
.prompt-top p{font-family:var(--f-zh);font-size:15.5px;line-height:1.8}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--sunk);border-bottom:1px solid var(--line)}
.count{font-size:13px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px}
.bar{width:120px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.bar.done i{background:var(--ok)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--plum)}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.sheet{padding:16px;overflow-x:auto}
textarea.grid{--c:32px;display:block;margin:0 auto;resize:vertical;min-height:calc(var(--c)*8 + 2px);
  font-family:var(--f-zh);font-size:20px;line-height:var(--c);letter-spacing:12px;padding:0 0 0 6px;
  border:1px solid var(--grid);border-radius:2px;color:var(--fg);background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:var(--c) var(--c);background-position:-1px -1px;background-attachment:local;word-break:break-all}
textarea.lines{display:block;width:100%;min-height:260px;resize:vertical;font-family:var(--f-zh);font-size:17px;line-height:34px;padding:0 10px;
  border:1px solid var(--line);border-radius:6px;color:var(--fg);background-color:var(--surface);
  background-image:linear-gradient(transparent 33px,var(--line) 33px);background-size:100% 34px;background-attachment:local}
.ref{padding:0 16px 16px}
.ref details{border-top:1px dashed var(--line);padding-top:12px}
.ref summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--plum)}
.note{font-size:12.5px;color:var(--muted)}
.samples{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.sample{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.sample figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:13px;color:var(--muted)}
.sample figcaption b{color:var(--plum);font-size:15px}
.sample figcaption .label{color:var(--gold)}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 22px 18px;font-size:16px;line-height:2;
  box-shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(60,20,30,.35);flex:1}
.l-title{text-align:center;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.2em;margin-bottom:4px}
.l-body{margin:0;text-indent:2em}
.l-zhi{text-indent:4em}
.l-sign{text-align:right}
.l-list{margin:0;padding-left:4em}
.l-h{margin:4px 0 0;font-weight:700}
.l-kv{margin:0;display:flex;flex-direction:column}.l-kv div{display:flex;gap:2px;min-width:0}.l-kv dt{font-weight:700;flex:none}.l-kv dd{margin:0;min-width:0}
.l-gap{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.l-head{margin:0 0 12px;padding:0 0 10px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.8;display:flex;flex-direction:column}
.l-head div{display:flex;gap:4px;min-width:0}.l-head dt{color:var(--muted);flex:none}.l-head dd{margin:0;overflow-wrap:anywhere}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;background:var(--sunk);border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .zh{color:var(--plum);font-size:15.5px}
.num-c{font-family:var(--f-display);color:var(--gold);font-size:18px;font-variant-numeric:tabular-nums;width:36px}
.rule{white-space:pre-line;font-family:var(--f-body),var(--f-zh)}
.tipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.tipbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tipbox .label{color:var(--gold)}
.tipbox ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.tipbox li{display:flex;flex-direction:column;gap:1px;font-size:14px}
.tipbox li b{color:var(--plum);font-weight:500;font-size:15.5px}
.tipbox li b+span{color:var(--muted);font-size:13.5px}
.prompts{display:flex;flex-direction:column;gap:16px}


.headrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.viewbtns{display:flex;gap:6px}
.viewbtns button{font-size:13px;padding:6px 12px;border-radius:99px}
.viewbtns button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:var(--surface)}
.prio{margin:0;font-size:13.5px;padding:8px 12px;border-radius:8px;background:var(--sunk);max-width:none}
.prio.t1{background:var(--gold-soft)}
.fire{font-size:13px}
.nav .vol.t1{color:var(--plum)}
.dich{background:var(--sunk);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.dich p{margin:0;font-size:14px;line-height:1.7}
.dich .label{color:var(--gold)}
body.no-vi .vi-only{display:none!important}
ruby{display:inline-flex;flex-direction:column-reverse;align-items:center;vertical-align:bottom;line-height:1.25;text-indent:0}
rt{display:block;font-family:var(--f-body);font-size:.52em;line-height:1.2;color:var(--muted);font-weight:400;letter-spacing:0;padding:0 1px;white-space:nowrap}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:22px;padding-block:18px 48px}
  .side{position:static}
  .nav{display:flex;overflow-x:auto;gap:4px}
  .nav li{flex:none}
  .nav .vol{align-self:center;padding:0 6px}
  .nav a{grid-template-columns:auto auto;}
  .nav .vi,.nav .pill{display:none}
  .head h1 .zh-title{font-size:32px}
  section.part{grid-template-columns:minmax(0,1fr)}
  .pno{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1240px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 0}
.topbar a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--plum);font-weight:600;font-size:14px}
.topbar img{width:30px;height:30px;border-radius:50%}
.topbar .back{color:var(--muted);font-weight:500;font-size:13px}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head><body>
<div class="topbar"><a href="../"><img src="../img/logo.webp" alt="Logo">Cô Thảo tiếng Trung</a><a class="back" href="../">← Về trang chính</a></div>
<div class="app">
  <aside class="side">
    <div class="brand"><small>cô Thảo tiếng Trung</small><b>Luyện viết HSK6 3.0</b></div>
    <div class="folder">
      <div class="folder-head">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <div><strong>Viết đoạn văn ứng dụng</strong><span class="zh">写作 第一部分 · ≥150字</span></div>
      </div>
      <ul class="nav" id="nav"></ul>
    </div>
    <div class="folder-soon">Thư mục tiếp theo (nghị luận ≥300字) sẽ thêm sau.</div>
  </aside>

  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<script>
/* ===== DỮ LIỆU =====
   Mỗi loại có 5 phần: intro, sample, template, tips, prompts.
   Phần nào chưa có nội dung để null → trang hiện "Đang cập nhật".
   prompts: [{de:"đề bài tiếng Trung", huongdan:"ghi chú (tuỳ chọn)", thamkhao:"bài tham khảo (tuỳ chọn)"}] */
const LOAI = [
  { id:"loai-1", zh:"请假条", vi:"Giấy xin nghỉ / Đơn xin nghỉ",
    intro:{ text:"Là dạng thư ngắn (便条) dùng để xin phép người có trách nhiệm (thầy cô, quản lý, sếp) nghỉ học, nghỉ làm hoặc không tham gia hoạt động tập thể.",
      group:"Phân loại theo nguyên nhân / nội dung nghỉ（根据请假原因/内容）",
      types:[["病假条","Đơn xin nghỉ ốm: bản thân bị ốm, bị thương, đi khám bệnh hoặc phẫu thuật."],
             ["事假条","Đơn xin nghỉ việc riêng: việc gia đình hoặc việc cá nhân chính đáng (kết hôn, đón người thân ở sân bay, dự sinh nhật cha mẹ…)."]]},
    source:"An Intermediate and Advanced Chinese Writing Course for Foreigners 1, tr. 21–24",
    sample:[
      { label:"病假条", vi:"Nghỉ ốm · học sinh gửi thầy cô",
        letter:{ title:"请假条", to:"张老师：",
          body:["今天起床后我感到脑门发热，嗓子疼，全身不适。我马上到医院看病，医生说我是上呼吸道感染，给我开了一些药并建议我在家休息一天。所以明天（9月22日）上午的写作课我不能上了。特向您请假，请您准假。"],
          closing:false, sign:"", date:"" },
        note:"Bản trong tài liệu chưa có phần 此致敬礼, ký tên và ngày tháng." },
      { label:"事假条", vi:"Nghỉ việc riêng · gửi viện trưởng",
        letter:{ title:"请假条", to:"王院长：",
          body:["我妹妹将于12月28日结婚。作为她唯一的哥哥，我非常希望能够回国协助她举办婚礼并当面祝福她。因此，我拟于12月26—29日请假四天。恳请您批准！"],
          closing:true, sign:"赵大卫", date:"2016年12月23日" } },
      { label:"病假条", vi:"Nghỉ ốm dài ngày · gửi chủ tịch HĐQT, có lời xin lỗi cuối đơn",
        letter:{ title:"请假条", to:"尊敬的刘董事长：",
          body:["近日本人身体状况欠佳，经几家医院多方会诊，未查出病因。现已联系德国一家医院，拟于5月1日赴德治病，特向您与诸位董事请假两个月，恳请批准为盼，并对在此期间因病影响公司工作深表歉意。"],
          closing:true, sign:"高吉", date:"2016年4月19日" } }
    ],
    template:{
      intro:"Khung chuẩn của một đơn xin nghỉ gồm 6 thành phần bắt buộc, theo đúng thứ tự:",
      rows:[
        ["标题","Tiêu đề","Chính giữa dòng đầu tiên","Viết đúng 3 chữ: 请假条"],
        ["称呼","Xưng hô","Dòng thứ 2, sát lề trái (顶格), có dấu ：","尊敬的 + họ tên / chức danh + ：\nVí dụ: 尊敬的王老师：　刘经理："],
        ["正文","Nội dung","Lùi vào 2 ô đầu dòng","Trình bày 3 ý chính:\n① Lý do xin nghỉ chính đáng\n② Thời gian nghỉ cụ thể (từ ngày… đến ngày…)\n③ Lời đề nghị phê duyệt"],
        ["祝颂语","Lời chúc","Viết thành 2 dòng riêng","Dòng 1: lùi 4 ô, ghi 此致 (không dấu câu)\nDòng 2: sát lề trái, ghi 敬礼！(có dấu ！)"],
        ["署名","Ký tên","Góc dưới bên phải","Họ tên người viết, ví dụ: 赵大卫 hoặc 学生：张三"],
        ["日期","Ngày tháng","Ngay dưới phần ký tên","Định dạng chuẩn: YYYY年MM月DD日"]
      ]},
    tips:{
      groups:[
        { title:"Chú ý định dạng", items:[
          {vi:"Lý do rõ ràng, ngắn gọn: chỉ nêu đúng nguyên nhân cốt lõi (bệnh tật, việc gia đình), không kể lan man hay giải thích dài dòng."},

    source:"An Intermediate and Advanced Chinese Writing Course for Foreigners 1, tr. 43–46",
    sample:[
      { label:"感谢信", vi:"Gửi tập thể · cảm ơn bệnh viện (tr. 44)",
        letter:{ title:"感谢信", to:"新仁医院：",
          body:["我要对贵院表示万分感谢！我是一个来北京打工的普通农民。一个月前，我的妻子突然心脏病复发，情况异常紧急。抱着一线希望，我们住进了贵院。贵院的陈佳大夫对我妻子的身体状况做了全面的检查之后，果断地决定立即手术。以我的收入，根本支付不起手术费。这时，贵院的大夫纷纷向我伸出了援助之手，给我捐助了医疗费。当我表示谢绝时，他们都说：“救人要紧，没有什么比生命更可贵。”万幸的是，手术相当成功。术后，各位护士又对我的妻子进行了精心护理，使得我妻子的病情很快好转。现在，我的妻子已经可以出院了。这对于我们全家来说，简直是个奇迹。",
                "贵院的大夫不仅医术高，医德更高，是真正的白衣天使！我们全家都非常感动，我们无以为回报，只有把这份恩情记在心里，深深地道一声感谢。"],
          closing:true, sign:"高壮", date:"2016年5月18日" } },
      { label:"致……的感谢信", vi:"Cảm ơn cá nhân, gửi qua nhà trường (tr. 45)",
        letter:{ title:"致刘小丽的感谢信", to:"xx大学语言学院：",
          body:["我要向贵院的刘小丽同学表示衷心的感谢！刘小丽同学拾金不昧的精神令我十分感动。",
                "我10月2日在北美餐厅吃饭，不慎将手提包遗落在饭桌上，包里有近万元现金和身份证件、信用卡、公司的文件等。这些东西对于我来说十分重要，关系到我公司的经济利益。如果手提包内的物品丢失，后果将不堪设想。事后我非常焦虑，往返几次都没有找到。正当我准备报警、挂失银行卡、作废公司的文件时，接到电话，得知手提包被贵校的一名学生捡到。这位同学捡到我的手提包后，根据包上的公司名称先与我公司取得了联系，进而通知了我。之后，这位同学及时地把手提包归还给我。看到手提包失而复得，包内物品一样不缺，我欣喜万分！更令我感动的是，为表达谢意，我拿出2000元钱递给该同学作为报答时，被这名同学婉言拒绝了。",
                "后来，我得知该同学是贵校语言学院的学生刘小丽，她具有良好的社会公德与现代大学生高尚的品质。感谢刘小丽同学的热心与无私，也感谢贵校培养出这么优秀的人才。请接受本人向贵校以及刘小丽同学致以崇高的敬意与深深的谢意！"],
          closing:true, sign:"北京科技公司 王云", date:"2016年10月3日" } }
    ],

      rows:[

        ["称呼","Xưng hô","Dòng 2, sát lề trái (顶格), thêm dấu ：","Tên tập thể hoặc cá nhân được cảm ơn\nVí dụ: 新仁医院：　xx大学语言学院："],

  "Đơn xin. Kính gửi Giáo sư Lý: Chào giáo sư! Tôi rất vinh hạnh có cơ hội xin làm nghiên cứu sau tiến sĩ tại Khoa Trung văn, Đại học Bắc Kinh. Đại học Bắc Kinh lịch sử lâu đời, nhân tài lớp lớp, tôi ngưỡng mộ đã lâu. Nếu được đến đây học tập nâng cao, đó sẽ là tài sản quan trọng trong đời tôi. Hiện tôi là nghiên cứu sinh tiến sĩ năm thứ ba ngành Văn hoá Trung Quốc, Khoa Ngôn ngữ và Văn hoá, Đại học Oxford (Anh), sắp tốt nghiệp. …… Tôi tin chắc nếu được trao cơ hội, tôi nhất định sẽ tiến bộ hơn nữa. Xin giáo sư chấp nhận đơn của tôi. Kèm theo thư là sơ yếu lý lịch. Nếu có dịp được gặp trực tiếp giáo sư, tôi vô cùng cảm kích. Trân trọng! — Người làm đơn: Lý Cát, 1/3/2017",
  "Đơn đề nghị điều chỉnh giờ học và thời gian học kỳ. Kính gửi thầy Hiệu trưởng: Chào thầy! Em là du học sinh Học viện Hán ngữ, rất mạo muội viết lá đơn này gửi thầy. Về giờ lên lớp, em mong thầy nghe ý kiến của du học sinh chúng em. Theo quy định, các khoa đều vào học lúc 8 giờ sáng. Với du học sinh, giờ này quá sớm! Theo khảo sát của em, phần lớn du học sinh ở nước mình đều 9 giờ mới vào học…… Nếu đổi giờ học thành 9 giờ, vừa tránh được giờ cao điểm, vừa giúp sinh viên ngủ đủ giấc, từ đó nâng cao hiệu quả học tập. Ngoài ra, học kỳ của chúng em quá dài!…… Thưa thầy, liệu thầy có thể dựa vào tình hình của chúng em mà thay đổi giờ học và thời gian học kỳ cho du học sinh không ạ? Kính mong thầy xem xét. Mong sớm nhận được hồi âm của thầy. Trân trọng! — Người làm đơn: Mã Trung Hoa, 1/3/2016"],
 "loai-5":[
  "Kính gửi Bệnh viện Tân Nhân: Tôi xin gửi lời cảm ơn vô hạn tới quý viện! Tôi là một nông dân bình thường lên Bắc Kinh làm thuê. Một tháng trước, bệnh tim của vợ tôi đột ngột tái phát, tình hình hết sức nguy cấp. Ôm một tia hy vọng, chúng tôi nhập viện tại quý viện. Sau khi kiểm tra toàn diện, bác sĩ Trần Giai quyết đoán chỉ định mổ ngay. Với thu nhập của tôi, tôi hoàn toàn không đủ tiền mổ. Lúc ấy, các bác sĩ của quý viện lần lượt chìa tay giúp đỡ, quyên góp viện phí cho tôi. Khi tôi từ chối, họ đều nói: “Cứu người là quan trọng, không gì quý hơn sinh mạng.” May mắn thay, ca mổ rất thành công. Sau mổ, các y tá chăm sóc vợ tôi tận tình, giúp cô ấy nhanh chóng hồi phục. Giờ vợ tôi đã có thể xuất viện. Với cả nhà tôi, đây quả là kỳ tích. Các bác sĩ của quý viện không chỉ giỏi nghề mà y đức còn cao hơn, là những thiên thần áo trắng thực sự! Cả nhà tôi vô cùng cảm động, không biết lấy gì báo đáp, chỉ biết khắc ghi ân tình này và nói một lời cảm ơn sâu sắc. Trân trọng! — Cao Tráng, 18/5/2016",
  "Thư cảm ơn Lưu Tiểu Lệ. Kính gửi Học viện Ngôn ngữ, Đại học xx: Tôi xin gửi lời cảm ơn chân thành tới bạn Lưu Tiểu Lệ của quý học viện! Tinh thần nhặt được của rơi không tham của bạn khiến tôi vô cùng cảm động. Ngày 2/10 tôi ăn ở nhà hàng Bắc Mỹ, vô ý để quên túi xách trên bàn; trong túi có gần mười nghìn tệ tiền mặt, giấy tờ tuỳ thân, thẻ tín dụng, tài liệu công ty… Những thứ này rất quan trọng, liên quan đến lợi ích kinh tế của công ty. Nếu mất, hậu quả khó lường. Tôi vô cùng lo lắng, quay lại tìm mấy lần đều không thấy. Đúng lúc định báo cảnh sát, báo mất thẻ ngân hàng, huỷ tài liệu công ty thì tôi nhận được điện thoại, biết túi được một sinh viên của quý trường nhặt được. Bạn ấy dựa vào tên công ty trên túi để liên hệ với công ty tôi trước, rồi báo cho tôi, sau đó kịp thời trả lại túi. Thấy túi mất rồi lại tìm được, đồ bên trong không thiếu thứ gì, tôi mừng khôn xiết! Cảm động hơn là khi tôi đưa 2.000 tệ để cảm ơn, bạn ấy đã khéo léo từ chối. Sau này tôi biết bạn ấy là Lưu Tiểu Lệ, sinh viên Học viện Ngôn ngữ, có đạo đức xã hội tốt và phẩm chất cao đẹp của sinh viên thời nay. Cảm ơn sự nhiệt tình, vô tư của bạn Lưu Tiểu Lệ, cũng cảm ơn quý trường đã đào tạo nên nhân tài xuất sắc như vậy. Xin nhận ở tôi lòng kính trọng và lời cảm ơn sâu sắc! Trân trọng! — Vương Vân, Công ty Khoa học Kỹ thuật Bắc Kinh, 3/10/2016"],

  "Kính gửi ông Hạ Tân Kiến: Vui mừng được tin ông có thành tựu nổi bật trong nghiên cứu triết học Nho gia, tác phẩm “Nghiên cứu Tuân Tử” vừa đạt giải Nhất Giải thưởng Sáng tạo Triết học và Khoa học Xã hội quốc gia. Xin gửi tới ông lời chúc mừng chân thành! Niềm say mê học thuật và những thành tựu của ông mãi khiến mọi người ngưỡng mộ. Tác phong tận tuỵ, miệt mài nghiên cứu của ông luôn là tấm gương để chúng tôi học tập. Chúc ông không ngừng tiến bước trên con đường học thuật, đạt những đỉnh cao mới! — Viên Quân, 21/12/2016",

LOAI.forEach(l=>{ if(DICH[l.id]&&l.sample) l.sample.forEach((x,i)=>{ if(DICH[l.id][i]) x.dich=DICH[l.id][i]; }); });

/* ===== NÚT HIỂN THỊ: pinyin / tiếng Việt (nhớ lựa chọn trên máy) ===== */
const VIEW = { py: store0("hsk6-viet:py")==="1", vi: store0("hsk6-viet:vi")!=="0" };
function store0(k){try{return localStorage.getItem(k)}catch(e){return null}}

const PHAN = [
  {key:"intro",    vi:"Giới thiệu công dụng", zh:"用途与分类"},
  {key:"sample",   vi:"Văn bản mẫu",          zh:"范文"},
  {key:"template", vi:"Cách làm theo template", zh:"写作模板"},
  {key:"tips",     vi:"Chú ý khi viết & mẹo", zh:"注意事项与技巧"},
  {key:"prompts",  vi:"Đề luyện tập",         zh:"同类题目练习"}
];

const MIN_ZI = 150;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const filled = l => PHAN.filter(p=>l[p.key]).length;
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
/* đếm chữ Hán + dấu câu toàn角 (giống cách tính số chữ khi thi) */
const countZi = t => (t.match(/[㐀-鿿豈-﫿　-〿＀-￯]/g)||[]).length;

function renderNav(cur){
  document.getElementById("nav").innerHTML = LOAI.map((l,i)=>{
    const t=PRIO[l.id].t, head=(i===0||PRIO[LOAI[i-1].id].t!==t)?`<li class="vol t${t}">${TIERS[t]}</li>`:"";
    return `${head}<li><a href="#${l.id}" ${l.id===cur?'aria-current="page"':''} title="${esc(PRIO[l.id].why)}">
      <span class="n">${i+1}</span>
      <span class="t"><span class="zh">${l.zh}${t===1?' <span class="fire" aria-label="Đã ra thi">🔥</span>':""}</span><span class="vi">${esc(l.vi)}</span></span>
      <span class="pill">${filled(l)}/5</span></a></li>`}).join("");
}

function pending(what){
  return `<div class="pending"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <div><b>Đang cập nhật</b><span>${what}</span></div></div>`;
}

function practiceBox(id, de, huongdan, thamkhao, no){
  return `<div class="prompt" data-key="${id}">
    <div class="prompt-top"><span class="label">${de?"题目 "+(no||""):"Ô luyện tập tự do"}</span>
      <p class="${de?"de":""}">${de?esc(de):"Chưa có đề cho dạng này. Có thể tự đặt đề và viết thử ở đây."}</p>
      ${huongdan?`<span class="note vi-only">${esc(huongdan)}</span>`:""}</div>
    <div class="tools">
      <div class="count"><span><b class="num">0</b> / ${MIN_ZI} 字</span><span class="bar"><i></i></span></div>
      <div class="btns"><button type="button" data-act="copy">Sao chép bài</button><button type="button" data-act="mode">Dòng kẻ</button><button type="button" data-act="clear">Xoá bài</button></div>
    </div>
    <div class="sheet"><textarea id="ta-${id}" class="grid" spellcheck="false" aria-label="Ô viết bài"></textarea></div>
    ${thamkhao?`<div class="ref"><details><summary>Xem bài tham khảo</summary><p class="zh" style="margin-top:10px;line-height:1.9">${esc(thamkhao)}</p></details></div>`:""}
  </div>`;
}

function renderPart(l, p, idx){
  const v = l[p.key];
  let body = "";
  if(p.key==="intro"){
    body = `<p>${esc(v.text)}</p><span class="label">${esc(v.group)}</span>
      <div class="types">${v.types.map(([z,t])=>`<div class="type"><span class="zh">${z}</span><span>${esc(t)}</span></div>`).join("")}</div>`;
  } else if(p.key==="prompts"){
    body = v && v.length ? `<div class="prompts">${v.map((q,i)=>practiceBox(`${l.id}-${i}`,q.de,q.huongdan,q.thamkhao,i+1)).join("")}</div>`
         : pending("Các đề bài viết tương tự của dạng "+l.zh+" sẽ được thêm vào đây, mỗi đề kèm một ô luyện tập.") + practiceBox(`${l.id}-free`);
  } else if(v && p.key==="sample" && Array.isArray(v)){
    body = `<div class="samples">${v.map((s,k)=>{const L=s.letter;
      const bodyTxt=L.body.map(b=>typeof b==="string"?b:b.list?b.list.join(""):b.kv?b.kv.map(x=>x.join("：")).join(""):b.h?b.h:"").join("");
      const cl = L.closing===true?{a:"此致",b:"敬礼！"}:(L.closing||null);
      const signs=[].concat(L.sign||[]);
      const all=[L.title||"",L.to||"",L.greet||"",bodyTxt,cl?cl.a+cl.b:"",signs.join(""),L.date||""].join("");
      return `<figure class="sample"><figcaption><span class="label">Mẫu ${k+1}</span><b class="zh">${s.label}</b><span>${esc(s.vi)}</span><span class="pill">≈ ${countZi(all)} 字</span></figcaption>
        <div class="letter zh">
          ${L.header?`<dl class="l-head">${L.header.map(([k,v])=>`<div><dt>${k}：</dt><dd>${v}</dd></div>`).join("")}</dl>`:""}
          ${L.title?`<div class="l-title">${L.title}</div>`:""}${L.to?`<div class="l-to">${L.to}</div>`:""}
          ${L.greet?`<p class="l-body">${L.greet}</p>`:""}
          ${L.body.map(b=>typeof b==="string"?`<p class="l-body">${b}</p>`:b.list?`<ol class="l-list">${b.list.map(x=>`<li>${x}</li>`).join("")}</ol>`:b.kv?`<dl class="l-kv">${b.kv.map(([k,v])=>`<div><dt>${k}：</dt><dd>${v}</dd></div>`).join("")}</dl>`:b.h?`<p class="l-h">${b.h}</p>`:`<p class="l-gap">${esc(b.gap)}</p>`).join("")}
          ${cl?`<div class="l-zhi" style="text-indent:${cl.indent||4}em">${cl.a}</div><div class="l-li">${cl.b}</div>`:""}
          ${signs.map(x=>`<div class="l-sign">${x}</div>`).join("")}${L.date?`<div class="l-sign">${L.date}</div>`:""}
        </div>${s.dich?`<div class="dich vi-only"><span class="label">Dịch nghĩa</span><p>${esc(s.dich)}</p></div>`:""}${s.note?`<span class="note">${esc(s.note)}</span>`:""}</figure>`}).join("")}</div>`;
  } else if(v && p.key==="template" && v.rows){
    body = `<p>${esc(v.intro)}</p>${v.tableTitle?`<span class="label">${esc(v.tableTitle)}</span>`:""}<div class="tbl"><table><thead><tr><th>#</th><th>Thành phần</th><th>Vị trí trình bày</th><th>Cụm từ mẫu / quy tắc</th></tr></thead><tbody>
      ${v.rows.map((r,k)=>`<tr><td class="num-c">${k+1}</td><td><b class="zh">${r[0]}</b><br><span class="note">${esc(r[1])}</span></td><td>${esc(r[2])}</td><td class="rule">${esc(r[3])}</td></tr>`).join("")}
      </tbody></table></div>${v.extra?`<div class="tipgrid">${v.extra.map(g=>`<div class="tipbox"><span class="label">${esc(g.title)}</span><ul>${g.items.map(it=>`<li>${it.zh?`<b class="zh">${esc(it.zh)}</b>`:""}<span>${esc(it.vi)}</span></li>`).join("")}</ul></div>`).join("")}</div>`:""}`;
  } else if(v && p.key==="tips" && v.groups){
    body = `<div class="tipgrid">${v.groups.map(g=>`<div class="tipbox"><span class="label">${esc(g.title)}</span><ul>
      ${g.items.map(it=>`<li>${it.zh?`<b class="zh">${esc(it.zh)}</b>`:""}<span class="${it.zh?"vi-only":""}">${esc(it.vi)}</span></li>`).join("")}</ul></div>`).join("")}</div>`;
  } else {
    body = v ? `<div class="zh" style="white-space:pre-wrap;line-height:1.9">${esc(v)}</div>`
             : pending({sample:"Văn bản mẫu "+l.zh+" hoàn chỉnh.",template:"Khung bố cục rút ra từ văn bản mẫu: các phần bắt buộc và mẫu câu dùng được.",tips:"Lỗi hay gặp, quy ước trình bày và mẹo tiết kiệm thời gian khi thi."}[p.key]);
  }
  return `<section class="part" id="${l.id}-${p.key}"><div class="pno">${idx}</div>
    <div class="pbody"><h2>${p.vi}<small class="zh">${p.zh}</small></h2>${body}</div></section>`;
}

function render(){
  const id = (location.hash||"").slice(1);
  const l = LOAI.find(x=>x.id===id) || LOAI[0];
  const i = LOAI.indexOf(l);
  renderNav(l.id);
  document.getElementById("main").innerHTML = `
    <header class="head">
      <div class="headrow"><div class="crumb">Viết đoạn văn ứng dụng · Tập ${l.vol||1} · <b>${TIERS[PRIO[l.id].t]}</b></div>
        <div class="viewbtns" role="group" aria-label="Hiển thị">
          <button type="button" id="btn-py" aria-pressed="${VIEW.py}">拼 Pinyin</button>
          <button type="button" id="btn-vi" aria-pressed="${VIEW.vi}">Tiếng Việt</button></div></div>
      <h1><span class="zh-title">${l.zh}</span><span class="vi-title">${esc(l.vi)}</span></h1>
      <p class="prio t${PRIO[l.id].t}">${PRIO[l.id].t===1?"🔥 ":""}<b>${TIERS[PRIO[l.id].t].replace("🔥 ","")}:</b> ${esc(PRIO[l.id].why)}</p>
      <div class="meta"><span class="chip gold">${filled(l)}/5 phần đã có nội dung</span><span class="chip zh">写作第一部分 · 不少于150字</span>${l.source?`<span class="chip">Nguồn: ${esc(l.source)}</span>`:""}</div>
    </header>
    <nav class="toc" aria-label="Các phần">${PHAN.map((p,k)=>`<a href="#${l.id}" data-jump="${l.id}-${p.key}"><span class="dot ${l[p.key]?"on":""}"></span>${k+1}. ${p.vi}</a>`).join("")}</nav>
    ${PHAN.map((p,k)=>renderPart(l,p,k+1)).join("")}`;
  wire(); applyView();
}

const HAN=/[\u3400-\u9fff]+/g;
function rubify(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("rt,textarea,.dich,script")||!/[\u3400-\u9fff]/.test(n.nodeValue)?2:1});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{const f=document.createDocumentFragment();let last=0;const t=n.nodeValue;
    t.replace(HAN,(run,at)=>{ if(at>last)f.append(t.slice(last,at));
      const py=pinyinPro.pinyin(run,{type:"array",toneType:"symbol"});
      [...run].forEach((c,k)=>{const r=document.createElement("ruby");r.append(c);const rt=document.createElement("rt");rt.textContent=py[k]||"";r.append(rt);f.append(r)});
      last=at+run.length;});
    if(last<t.length)f.append(t.slice(last));n.replaceWith(f);});
}
function applyView(){
  document.body.classList.toggle("no-vi",!VIEW.vi);
  const bp=document.getElementById("btn-py"), bv=document.getElementById("btn-vi");
  if(VIEW.py){ if(window.pinyinPro){ document.querySelectorAll(".zh-title,.type .zh,.letter,.tipbox li b,.prompt-top p.de,td b.zh").forEach(rubify); }
    else if(bp){ bp.title="Chưa tải được bộ pinyin, kiểm tra kết nối mạng."; } }
  if(bp) bp.onclick=()=>{VIEW.py=!VIEW.py;try{localStorage.setItem("hsk6-viet:py",VIEW.py?"1":"0")}catch(e){}keepScroll(render)};
  if(bv) bv.onclick=()=>{VIEW.vi=!VIEW.vi;try{localStorage.setItem("hsk6-viet:vi",VIEW.vi?"1":"0")}catch(e){}bv.setAttribute("aria-pressed",VIEW.vi);document.body.classList.toggle("no-vi",!VIEW.vi)};
}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}

function fitGrid(ta){
  if(!ta.classList.contains("grid")) { ta.style.width=""; return; }
  const box = ta.parentElement.clientWidth - 32;
  const cols = Math.max(10, Math.min(24, Math.floor(box/32)));
  ta.style.width = (cols*32 + 2) + "px";
}

function wire(){
  document.querySelectorAll(".toc a").forEach(a=>a.addEventListener("click",e=>{
    e.preventDefault(); document.getElementById(a.dataset.jump)?.scrollIntoView({behavior:"smooth"});
  }));
  document.querySelectorAll(".prompt").forEach(box=>{
    const key = "hsk6-viet:"+box.dataset.key;
    const ta = box.querySelector("textarea"), num = box.querySelector(".num"), bar = box.querySelector(".bar");
    const upd = ()=>{ const n = countZi(ta.value); num.textContent=n;
      bar.firstElementChild.style.width = Math.min(100,n/MIN_ZI*100)+"%"; bar.classList.toggle("done",n>=MIN_ZI); };
    ta.value = store.get(key) || ""; upd(); fitGrid(ta);
    ta.addEventListener("input",()=>{ store.set(key,ta.value); upd(); });
    box.querySelector('[data-act="mode"]').addEventListener("click",e=>{
      const g = ta.classList.toggle("grid"); ta.classList.toggle("lines",!g);
      e.target.textContent = g?"Dòng kẻ":"Ô vuông"; fitGrid(ta);
    });
    const cp = box.querySelector('[data-act="copy"]');
    cp.addEventListener("click",()=>{
      const done=ok=>{cp.textContent=ok?"Đã chép ✓":"Đã chọn bài, bấm Ctrl+C";setTimeout(()=>cp.textContent="Sao chép bài",2200)};
      if(!ta.value.trim()){cp.textContent="Chưa có bài";setTimeout(()=>cp.textContent="Sao chép bài",1800);return}
      const fb=()=>{ta.focus();ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}done(ok)};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(()=>done(true),fb)}else fb();
    });
    const clr = box.querySelector('[data-act="clear"]');
    clr.addEventListener("click",()=>{
      if(clr.dataset.sure){ ta.value=""; store.set(key,""); upd(); clr.textContent="Xoá bài"; delete clr.dataset.sure; }
      else { clr.dataset.sure=1; clr.textContent="Bấm lần nữa để xoá"; setTimeout(()=>{clr.textContent="Xoá bài";delete clr.dataset.sure},3000); }
    });
  });
}

window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
window.addEventListener("resize",()=>document.querySelectorAll("textarea").forEach(fitGrid));
render();
</script>
