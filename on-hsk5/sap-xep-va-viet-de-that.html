<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luyện viết HSK5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: phiếu luyện thi thân thiện, rõ ràng, khích lệ học viên
   IDEA: tờ phiếu trả lời HSK – thẻ từ để ghép, ô kẻ 方格 cho phần viết
   PICTURE: chính bài tập: hàng thẻ từ lớn và dòng trả lời ngay dưới tiêu đề
   COLOUR and TYPE: đỏ mận thương hiệu cô Thảo, điểm nhấn vàng gold; Be Vietnam Pro + Noto Sans SC
   LAYOUT: dải tiêu đề đỏ mận, thanh điểm dính trên, tab phần, cột bài tập một hàng */
:root{color-scheme:light dark;
 --bg:light-dark(#fbf8f4,#17100f);--card:light-dark(#ffffff,#221817);--ink:light-dark(#1d1412,#f3ebe6);--mute:light-dark(#6d5f5a,#b9aaa4);
 --plum:#9E2B25;--plum2:light-dark(#9E2B25,#e0675f);--gold:#D9B65C;--line:light-dark(#e8dfd8,#3a2b29);
 --chip:light-dark(#fff6e3,#3a2d1c);--chipb:light-dark(#e6cf96,#6b5426);--ok:light-dark(#1d7a46,#5fd08f);--okbg:light-dark(#e8f6ee,#15301f);--bad:light-dark(#b3261e,#ff8a80);--badbg:light-dark(#fdecea,#3a1715)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
.zh{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
header{background:var(--plum);color:#fff;padding:clamp(22px,4vw,44px) max(5vw,16px) 18px}
header h1{margin:0;font-size:clamp(28px,5vw,44px);line-height:1.08;font-weight:800;text-wrap:balance}
header p{margin:8px 0 0;max-width:62ch;opacity:.92}
.who{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.who input{font:inherit;font-size:16px;padding:10px 14px;border-radius:10px;border:0;min-width:220px;color:#1d1412}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px max(5vw,16px);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.score{font-weight:800;font-size:18px;white-space:nowrap}.score b{color:var(--plum2)}
.meter{flex:1 1 160px;height:10px;border-radius:9px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px max(5vw,16px) 0}
nav a{flex:none;text-decoration:none;color:var(--ink);padding:10px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:15px;background:var(--card)}
nav a.on{background:var(--plum);border-color:var(--plum);color:#fff}
nav a small{opacity:.75;font-weight:400;margin-left:4px}
main{padding:16px max(5vw,16px) 64px;max-width:900px}
.intro{color:var(--mute);margin:6px 0 14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
h2{font-size:22px;margin:26px 0 8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;margin:12px 0}
.q.ok{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}.q.bad{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.qh{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:13px;margin-bottom:8px}
.num{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:10px;background:var(--plum);color:#fff;font-weight:800;font-size:15px}
.slot{min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.slot:empty::before{content:"Bấm các cụm từ bên dưới theo thứ tự";color:var(--mute);font-size:14px;padding-left:6px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:700 22px/1.2 "Noto Sans SC",sans-serif;padding:10px 14px;border-radius:12px;border:1.5px solid var(--chipb);background:var(--chip);color:var(--ink);cursor:pointer;min-height:48px}
.chip:hover{border-color:var(--plum2)}.slot .chip{background:var(--card);border-color:var(--plum2)}
.chip:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,nav a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrong{font:700 24px/1.4 "Noto Sans SC",sans-serif;margin:2px 0 10px}
.fix{width:100%;font:500 20px/1.4 "Noto Sans SC",sans-serif;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font:600 15px "Be Vietnam Pro",sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.main{background:var(--plum);border-color:var(--plum);color:#fff}
button.gold{background:var(--gold);border-color:var(--gold);color:#2b1d0a}
.fb{margin-top:10px;border-radius:12px;padding:10px 14px;display:none}
.fb.ok{display:block;background:var(--okbg);color:var(--ok)}.fb.bad{display:block;background:var(--badbg);color:var(--bad)}
.fb .ans{font:700 20px/1.5 "Noto Sans SC",sans-serif;color:var(--ink)}.fb .vi{color:var(--mute);font-size:15px}
.paper{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px}
.de{font:600 19px/1.6 "Noto Sans SC",sans-serif}
.words{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.w{font:700 20px "Noto Sans SC",sans-serif;padding:6px 12px;border-radius:10px;border:1.5px solid var(--chipb);background:var(--chip)}
.w.used{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
textarea{width:100%;min-height:180px;font:500 20px/2 "Noto Sans SC",sans-serif;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);color:var(--ink);
 background:var(--bg) repeating-linear-gradient(var(--bg) 0 39px,var(--line) 39px 40px);background-attachment:local;resize:vertical}
.count{color:var(--mute);font-size:14px;margin-top:6px}.count b{color:var(--ink)}
.mau{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--chip)}.mau.show{display:block}
.mau .zh{font-size:19px;line-height:1.9}
.tranh{color:var(--mute);font-style:italic}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 60px;position:relative;display:grid;gap:2px}
.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:34px;height:34px;border-radius:10px;background:var(--plum);color:#fff;font-weight:800;display:grid;place-items:center}
.steps li span,.tip span{font-family:"Be Vietnam Pro","Noto Sans SC",sans-serif}
.ex{margin-top:14px;border-radius:14px;background:var(--chip);border:1.5px solid var(--chipb);padding:14px 16px}
.exh{font-weight:800;margin-bottom:6px}.exq{font-size:22px;font-weight:700;margin-bottom:6px}.exs{margin:0;padding-left:20px}.exs li{margin:4px 0}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}
.tip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.tip b{color:var(--plum2)}
.zhmix{font-family:"Be Vietnam Pro","Noto Sans SC",sans-serif}
table.pt{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pt th{background:var(--plum);color:#fff;text-align:left;padding:10px 12px;font-size:14px}
.pt td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.pt td.exc{font-size:19px;font-weight:600}.pt td.src{color:var(--mute);white-space:nowrap;font-size:14px}
@media(max-width:600px){.pt thead{display:none}.pt tr{display:grid;padding:8px 0;border-top:1px solid var(--line)}.pt td{border:0;padding:3px 12px 3px 112px;position:relative}.pt td::before{content:attr(data-l);position:absolute;left:12px;top:5px;width:92px;color:var(--mute);font-size:13px;font-weight:600;font-family:"Be Vietnam Pro",sans-serif}}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.jump a{text-decoration:none;color:var(--plum2);border:1.5px solid var(--chipb);background:var(--chip);padding:8px 12px;border-radius:999px;font-weight:600;font-size:14px;min-height:40px;display:inline-flex;align-items:center}
h2.nhom{margin-top:34px;padding-bottom:6px;border-bottom:2px solid var(--gold);scroll-margin-top:130px}
h3{font-size:17px;margin:18px 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:600px){.chip{font-size:20px;padding:9px 12px}.score{font-size:16px}}
</style>
</head>
<body>
<header>
 <a href="./" style="color:#fff;opacity:.9;text-decoration:none;font-weight:600;display:inline-block;margin-bottom:10px">← Ôn HSK 5</a>
 <h1>Luyện viết HSK5 – đề thi thật 2025–2026</h1>
 <p>Ghép câu và viết đoạn văn. Làm xong từng câu thì bấm <b>Kiểm tra</b> để xem đúng sai và đáp án. Tiếng Trung cô Thảo.</p>
 <div class="who"><label for="ten">Họ tên:</label><input id="ten" placeholder="Nhập tên của bạn" autocomplete="name"></div>
</header>
<div class="bar">
 <span class="score" id="score">Đúng <b>0</b> / 0 câu đã chấm</span>
 <span class="meter" aria-hidden="true"><i id="meter"></i></span>
 <button class="gold" id="copy">Copy kết quả gửi cô</button>
</div>
<nav id="nav" class="scroll"></nav>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>
<script>
{

"他靠打工来交学费。"], "v": "", "tag": "Bài tương tự"}, {"n": 47, "k": "order", "f": ["保护环境", "每个人都", "有义务"], "a": ["每个人都有义务保护环境。"], "v": "", "tag": "Bài tương tự"}, {"n": 48, "k": "order", "f": ["压力", "运动", "有助于", "减轻"], "a": ["运动有助于减轻压力。"], "v": "", "tag": "Bài tương tự"}, {"n": 49, "k": "order", "f": ["一幅", "墙上", "挂着", "中国画"], "a": ["墙上挂着一幅中国画。"], "v": "", "tag": "Bài tương tự"}, {"n": 50, "k": "order", "f": ["严肃地", "批评了", "老师", "迟到的", "那个学生"], "a": ["老师严肃地批评了迟到的那个学生。"], "v": "", "tag": "Bài tương tự"}, {"n": 51, "k": "order", "f": ["是", "当一名翻译", "他从小的", "梦想"], "a": ["当一名翻译是他从小的梦想。"], "v": "", "tag": "Bài tương tự"}, {"n": 52, "k": "order", "f": ["工作过", "他曾经", "在北京"], "a": ["他曾经在北京工作过。"], "v": "", "tag": "Bài tương tự"}, {"n": 53, "k": "order", "f": ["十分", "这次比赛", "充分", "准备得"], "a": ["这次比赛准备得十分充分。"], "v": "", "tag": "Bài tương tự"}, {"n": 54, "k": "order", "f": ["被", "我的自行车", "偷走了", "小偷"], "a": ["我的自行车被小偷偷走了。"], "v": "", "tag": "Bài tương tự"}, {"n": 55, "k": "order", "f": ["重要的", "他为公司", "贡献", "做出了"], "a": ["他为公司做出了重要的贡献。"], "v": "", "tag": "Bài tương tự"}, {"n": 56, "k": "order", "f": ["你不是", "吗", "不喝酒了", "说过"], "a": ["你不是说过不喝酒了吗？"], "v": "", "tag": "Bài tương tự"}]}]}, {"id": "meo", "title": "Mẹo sắp xếp câu", "note": "Tóm tắt cách làm câu 91–98, mẹo nhận diện vị trí cụm từ và các cấu trúc hay ra, kèm ví dụ lấy từ chính các câu trong trang.", "groups": [], "guide": "<h2>Cách làm: 4 bước</h2><ol class=\"steps\"><li><b>Tìm động từ chính</b><span>Mảnh có 了 / 着 / 过, có 得, hoặc là 是 / 有 thường chứa vị ngữ. Đặt nó làm &quot;trục&quot; của câu.</span></li><li><b>Tìm chủ ngữ</b><span>Ai/cái gì làm hành động? Thường là danh từ, đại từ người, hoặc cụm danh từ có &quot;…的&quot; đứng trước.</span></li><li><b>Gắn các thành phần quanh trục</b><span>Định ngữ (…的) đứng trước danh từ. Trạng ngữ (thời gian, phó từ, năng nguyện, giới từ 把/被/对/在/为/跟) đứng trước động từ. Bổ ngữ (得…, 完/好/坏, 一遍, 进/在 + nơi chốn) đứng sau động từ.</span></li><li><b>Đọc lại và thêm dấu câu</b><span>Dùng hết các mảnh, không thêm bớt chữ. Câu kể kết thúc bằng 。, câu có 吗 / 不是…吗 kết thúc bằng ？. Câu phức hai vế có dấu phẩy ở giữa.</span></li></ol><div class=\"ex\"><div class=\"exh\">Ví dụ áp dụng (câu 27, đề 24/10/2026)</div><div class=\"zh exq\">抽屉里 ／ 他把 ／ 夹子 ／ 放进了 ／ 多余的</div><ol class=\"exs\"><li>Động từ chính: <span class=\"zh\">放进了</span>; có <span class=\"zh\">他把</span> nên đây là câu 把.</li><li>Chủ ngữ: <span class=\"zh\">他</span> (đã dính với 把).</li><li><span class=\"zh\">多余的</span> kết thúc bằng 的, nên đứng trước <span class=\"zh\">夹子</span>; <span class=\"zh\">抽屉里</span> là nơi chốn, đứng sau <span class=\"zh\">放进了</span>.</li><li>Ghép lại, thêm dấu chấm: <b class=\"zh\">他把多余的夹子放进了抽屉里。</b></li></ol></div><h2>Mẹo nhận diện vị trí</h2><div class=\"tips\"><div class=\"tip\"><b>Mảnh kết thúc bằng 的</b><span class=\"zhmix\">đứng ngay trước danh từ: 出席开幕式的 + 嘉宾, 公寓的 + 阳台上.</span></div><div class=\"tip\"><b>Mảnh bắt đầu bằng 把 / 被 / 对 / 为 / 在</b><span class=\"zhmix\">đứng sau chủ ngữ, trước động từ: 他把 + 发票 + 放在了…</span></div><div class=\"tip\"><b>Mảnh có 吗, 了 đứng riêng, hoặc 的 đứng riêng</b><span class=\"zhmix\">thường ở cuối câu: …咬坏 + 了, 我们一定会吸取教训 + 的.</span></div><div class=\"tip\"><b>Thấy một quan hệ từ, tìm ngay vế còn lại</b><span class=\"zhmix\">只有→才, 既然→就, 不但→而且, 即使→也, 尽管→还是/却, 之所以→是因为, 连→都.</span></div><div class=\"tip\"><b>Thứ tự trạng ngữ trước động từ</b><span class=\"zhmix\">thời gian → phó từ (也/都/已经/一定/正在) → năng nguyện (会/可以/能) → giới từ + tân ngữ → động từ. Ví dụ: 我们一定会吸取教训的。</span></div><div class=\"tip\"><b>Thời gian và nơi chốn đứng trước động từ</b><span class=\"zhmix\">khác tiếng Việt: 他曾经在北京工作过 (không viết 他工作过在北京).</span></div><div class=\"tip\"><b>Số / chỉ thị + lượng từ đứng trước danh từ</b><span class=\"zhmix\">那只股票, 那份合同, 一个大型的购物中心, 几朵白云.</span></div><div class=\"tip\"><b>Lỗi mất điểm hay gặp</b><span class=\"zhmix\">thiếu dấu câu cuối câu, chép sai nét chữ, lẫn 的 / 地 / 得, đặt phó từ sai bên 得 (准备得格外充分, không viết 准备格外得充分).</span></div></div><h2>Cấu trúc hay ra trong phần sắp xếp câu</h2><p class=\"intro\">Số câu ở cột cuối là câu trong trang này, bấm qua tab tương ứng để luyện lại.</p><table class=\"pt stack\"><thead><tr><th>Cấu trúc</th><th>Công thức</th><th>Ví dụ</th><th>Câu</th></tr></thead><tbody><tr><td><b class=\"zhmix\">Câu 把</b></td><td class=\"zhmix\">CN + 把 + tân ngữ + ĐT + bổ ngữ</td><td class=\"zh exc\">奶奶把这套公寓留给了姑姑。</td><td class=\"src\">Câu 2, 27, 35</td></tr><tr><td><b class=\"zhmix\">Câu 被</b></td><td class=\"zhmix\">Tân ngữ + 被 + người làm + ĐT + bổ ngữ + 了</td><td class=\"zh exc\">这块地毯被老鼠咬坏了。</td><td class=\"src\">Câu 22, 82</td></tr><tr><td><b class=\"zhmix\">Câu tồn hiện</b></td><td class=\"zhmix\">Nơi chốn + ĐT着 / 有 + số lượng + danh từ</td><td class=\"zh exc\">天空中飘着几朵白云。</td><td class=\"src\">Câu 11, 19</td></tr><tr><td><b class=\"zhmix\">Định ngữ dài</b></td><td class=\"zhmix\">[Ai + ĐT + 的] + 那 + lượng từ + danh từ</td><td class=\"zh exc\">经理买的那只股票涨了不少。</td><td class=\"src\">Câu 14, 31</td></tr><tr><td><b class=\"zhmix\">Năng nguyện + phó từ</b></td><td class=\"zhmix\">CN + 会/可以 + 直接/有效 + ĐT</td><td class=\"zh exc\">汇率变化会直接影响国际贸易。</td><td class=\"src\">Câu 10, 18</td></tr><tr><td><b class=\"zhmix\">Bổ ngữ trạng thái 得</b></td><td class=\"zhmix\">CN + ĐT得 + 格外/十分 + tính từ</td><td class=\"zh exc\">此次闭幕式准备得格外充分。</td><td class=\"src\">Câu 20, 79</td></tr><tr><td><b class=\"zhmix\">Kiêm ngữ 让</b></td><td class=\"zhmix\">A + 让 + B + ĐT / tính từ</td><td class=\"zh exc\">伙伴们的拥抱让我充满了力量。</td><td class=\"src\">Câu 3, 72, 96</td></tr><tr><td><b class=\"zhmix\">Hai phó từ liền nhau</b></td><td class=\"zhmix\">CN + 正在 + 逐步 + ĐT</td><td class=\"zh exc\">社会的文明程度正在逐步提高。</td><td class=\"src\">Câu 21</td></tr><tr><td><b class=\"zhmix\">Cụm động từ làm chủ ngữ</b></td><td class=\"zhmix\">[ĐT + tân ngữ] + 是 + …的 + danh từ</td><td class=\"zh exc\">当导演是我姐姐一直以来的梦想。</td><td class=\"src\">Câu 15, 30</td></tr><tr><td><b class=\"zhmix\">…之一</b></td><td class=\"zhmix\">A 是 + …的 + danh từ + 之一</td><td class=\"zh exc\">小麦是制作馒头的原料之一。</td><td class=\"src\">Câu 7</td></tr><tr><td><b class=\"zhmix\">是…的 (nhấn mạnh)</b></td><td class=\"zhmix\">CN + 是 + cách thức/thời gian + ĐT + 的</td><td class=\"zh exc\">小李是在朋友的帮助下找到工作的。</td><td class=\"src\">Câu 94</td></tr><tr><td><b class=\"zhmix\">会…的 (khẳng định)</b></td><td class=\"zhmix\">CN + 一定 + 会 + ĐT + tân ngữ + 的</td><td class=\"zh exc\">我们一定会吸取教训的。</td><td class=\"src\">Câu 32</td></tr><tr><td><b class=\"zhmix\">曾经…过</b></td><td class=\"zhmix\">CN + 曾经 + ĐT过 + tân ngữ</td><td class=\"zh exc\">舅舅曾经担任过电视台的主持人。</td><td class=\"src\">Câu 17</td></tr><tr><td><b class=\"zhmix\">既…又…</b></td><td class=\"zhmix\">CN + 既 A + 又 B</td><td class=\"zh exc\">我的奶奶既体贴又善良。</td><td class=\"src\">Câu 1</td></tr><tr><td><b class=\"zhmix\">靠…来…</b></td><td class=\"zhmix\">CN + 靠 + cách thức + 来 + ĐT</td><td class=\"zh exc\">这种昆虫靠翅膀振动来发声。</td><td class=\"src\">Câu 8</td></tr><tr><td><b class=\"zhmix\">对…展开</b></td><td class=\"zhmix\">CN + 对此/对… + 展开了 + …的 + danh từ</td><td class=\"zh exc\">双方对此展开了激烈的辩论。</td><td class=\"src\">Câu 4</td></tr><tr><td><b class=\"zhmix\">为…做出贡献</b></td><td class=\"zhmix\">CN + 为 + đối tượng + 做出了 + …的贡献</td><td class=\"zh exc\">爸爸为企业发展做出了巨大的贡献。</td><td class=\"src\">Câu 24</td></tr><tr><td><b class=\"zhmix\">像…似的</b></td><td class=\"zhmix\">CN + 像 + danh từ + 似的</td><td class=\"zh exc\">天上的大圆月像盘子似的。</td><td class=\"src\">Câu 28</td></tr><tr><td><b class=\"zhmix\">不是…吗 (hỏi vặn)</b></td><td class=\"zhmix\">你不是 + ĐT + … + 吗？</td><td class=\"zh exc\">你不是答应我不熬夜了吗？</td><td class=\"src\">Câu 38</td></tr><tr><td><b class=\"zhmix\">So sánh 比</b></td><td class=\"zhmix\">A + 比 + B + tính từ/ĐT + bổ ngữ</td><td class=\"zh exc\">他的成绩比去年提高了很多。</td><td class=\"src\">Câu 91</td></tr><tr><td><b class=\"zhmix\">连…都…</b></td><td class=\"zhmix\">CN + 连 + (cả) X + 都 + ĐT</td><td class=\"zh exc\">他连最简单的问题都回答不上来。</td><td class=\"src\">Câu 73</td></tr><tr><td><b class=\"zhmix\">随着…</b></td><td class=\"zhmix\">随着 + danh từ, + vế kết quả</td><td class=\"zh exc\">随着生活水平的提高，人们越来越注重健康。</td><td class=\"src\">Câu 74</td></tr><tr><td><b class=\"zhmix\">尽管…还是…</b></td><td class=\"zhmix\">尽管 + vế 1, + CN + 还是 + ĐT</td><td class=\"zh exc\">尽管天气很糟糕，比赛还是按时开始了。</td><td class=\"src\">Câu 75</td></tr><tr><td><b class=\"zhmix\">只有…才…</b></td><td class=\"zhmix\">只有 + điều kiện, + 才 + kết quả</td><td class=\"zh exc\">只有不断学习，才能适应社会的发展。</td><td class=\"src\">Câu 78</td></tr><tr><td><b class=\"zhmix\">由于…</b></td><td class=\"zhmix\">由于 + nguyên nhân, + kết quả</td><td class=\"zh exc\">由于堵车，他们迟到了半个小时。</td><td class=\"src\">Câu 80</td></tr><tr><td><b class=\"zhmix\">既然…就…</b></td><td class=\"zhmix\">既然 + CN + sự việc, + 就 + lời khuyên</td><td class=\"zh exc\">既然你已经答应了，就不要反悔。</td><td class=\"src\">Câu 84</td></tr><tr><td><b class=\"zhmix\">不但…而且…</b></td><td class=\"zhmix\">CN + 不但 A, + 而且 B</td><td class=\"zh exc\">他不但会说英语，而且说得很流利。</td><td class=\"src\">Câu 85</td></tr><tr><td><b class=\"zhmix\">之所以…是因为…</b></td><td class=\"zhmix\">CN + 之所以 + kết quả, + 是因为 + nguyên nhân</td><td class=\"zh exc\">他之所以进步这么快，是因为学习方法很科学。</td><td class=\"src\">Câu 90</td></tr><tr><td><b class=\"zhmix\">即使…也…</b></td><td class=\"zhmix\">即使 + giả định, + CN + 也 + ĐT</td><td class=\"zh exc\">即使遇到困难，我们也不能放弃希望。</td><td class=\"src\">Câu 92</td></tr><tr><td><b class=\"zhmix\">以…闻名</b></td><td class=\"zhmix\">CN + 以 + đặc điểm + 闻名</td><td class=\"zh exc\">这个城市以美丽的海滨风光闻名。</td><td class=\"src\">Câu 93</td></tr><tr><td><b class=\"zhmix\">值得</b></td><td class=\"zhmix\">A + 值得 + ai + ĐT</td><td class=\"zh exc\">这本书值得每个人认真读一读。</td><td class=\"src\">Câu 95</td></tr></tbody></table>"}, {"id": "viet", "title": "Viết câu 99", "note": "18 đề câu 99 thi thật (5 từ cho sẵn) chia theo 8 nhóm chủ đề hay ra. Mỗi bài khoảng 80 chữ, viết trong 15 phút; trang đếm số chữ Hán và đánh dấu từ đã dùng. Viết xong mới mở bài mẫu. Bài mẫu do cô Thảo soạn.", "groups": []}], "viet": [{"k": "v1", "cau": "Câu 99", "dot": "Đề thật 24/10/2026", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["无论", "热爱", "依然", "放弃", "成就"], "mau": "我的表哥从小就热爱画画。上大学时，家人希望他学经济，可他依然没有放弃自己的梦想。无论遇到多大的困难，他每天都坚持练习。经过十年的努力，他终于成了一名有名的画家，取得了很大的成就。", "nghia": "Anh họ tôi từ nhỏ đã rất yêu vẽ. Lên đại học, gia đình muốn anh học kinh tế, nhưng anh vẫn không từ bỏ ước mơ. Dù gặp khó khăn thế nào, ngày nào anh cũng kiên trì luyện tập. Sau mười năm nỗ lực, anh đã trở thành họa sĩ nổi tiếng và đạt được thành tựu lớn.", "nhom": "Nhóm 1 · Ước mơ, kiên trì, thành công", "g": 1}, {"k": "v5", "cau": "Câu 99", "dot": "Đề thật 27/02/2022", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["梦想", "支持", "发挥", "冠军", "辛苦"], "mau": "我从小就有一个梦想，就是成为一名游泳运动员。每天训练都非常辛苦，但是父母一直支持我、鼓励我。去年的全国比赛上，我发挥得特别好，终于拿到了冠军。站在领奖台上，我觉得以前的努力都是值得的。", "nghia": "Từ nhỏ tôi đã có ước mơ trở thành vận động viên bơi lội. Ngày nào tập luyện cũng rất vất vả, nhưng bố mẹ luôn ủng hộ, động viên tôi. Ở giải toàn quốc năm ngoái, tôi thi đấu đặc biệt tốt và cuối cùng giành chức vô địch. Đứng trên bục nhận giải, tôi thấy mọi nỗ lực trước đây đều xứng đáng.", "nhom": "Nhóm 1 · Ước mơ, kiên trì, thành công", "g": 1}, {"k": "v6", "cau": "Câu 99", "dot": "Đề thật · sách 真题集, đề 3", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["无论", "努力", "获得", "坚持", "放弃"], "mau": "去年我参加了公司的汉语考试，可是第一次没有通过。我很难过，甚至想过放弃。后来我告诉自己，无论多难都要坚持下去。我每天下班后都努力学习两个小时。半年以后，我终于通过了考试，还获得了公司的奖励。", "nghia": "Năm ngoái tôi dự kỳ thi tiếng Trung của công ty nhưng lần đầu không đạt. Tôi rất buồn, thậm chí từng nghĩ đến chuyện bỏ cuộc. Sau đó tôi tự nhủ dù khó đến đâu cũng phải kiên trì. Ngày nào tan làm tôi cũng chăm chỉ học hai tiếng. Nửa năm sau, tôi cuối cùng đã thi đỗ và còn được công ty khen thưởng.", "nhom": "Nhóm 1 · Ước mơ, kiên trì, thành công", "g": 1}, {"k": "v2", "cau": "Câu 99", "dot": "Đề thật 15/03/2026", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["措施", "火灾", "湿", "千万", "冷静"], "mau": "上个月，我们公司举行了一次消防演习。消防员告诉我们，发生火灾的时候千万不要慌张，一定要保持冷静。首先要用湿毛巾捂住口鼻，然后弯着腰从安全出口离开，千万不能坐电梯。这次演习让我学会了很多有效的自救措施。", "nghia": "Tháng trước công ty tôi tổ chức một buổi diễn tập phòng cháy. Lính cứu hỏa dặn chúng tôi khi xảy ra hỏa hoạn tuyệt đối đừng hoảng loạn, phải giữ bình tĩnh. Trước tiên dùng khăn ướt bịt mũi miệng, rồi cúi người đi ra lối thoát hiểm, tuyệt đối không đi thang máy. Buổi diễn tập giúp tôi học được nhiều biện pháp tự cứu hữu ích.", "nhom": "Nhóm 2 · An toàn, thói quen xấu, hậu quả", "g": 2}, {"k": "v7", "cau": "Câu 99", "dot": "Đề thật · sách 真题集, đề 2", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["开车", "喝酒", "要是", "从来", "后悔"], "mau": "我的邻居老王很喜欢喝酒，他总说自己酒量好，喝完酒开车从来没出过事。上个月他喝完酒开车回家，结果撞到了路边的树上，自己也受了伤。他现在非常后悔。要是当时他叫一辆出租车，就不会发生这样的事了。", "nghia": "Ông Vương hàng xóm nhà tôi rất thích uống rượu, ông luôn nói mình tửu lượng tốt, uống xong lái xe chưa bao giờ xảy ra chuyện gì. Tháng trước ông uống rượu rồi lái xe về nhà, kết quả đâm vào cây ven đường, bản thân cũng bị thương. Bây giờ ông vô cùng hối hận. Nếu lúc đó ông gọi taxi thì đã không xảy ra chuyện như vậy.", "nhom": "Nhóm 2 · An toàn, thói quen xấu, hậu quả", "g": 2}, {"k": "v8", "cau": "Câu 99", "dot": "Đề thật · sách 真题集, đề 1", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["回国", "帮助", "不得不", "遗憾", "祝福"], "mau": "玛丽是我在中国留学时最好的朋友，她经常帮助我练习口语。上个月她的妈妈生病了，她不得不提前回国。我们没能一起参加毕业典礼，我觉得很遗憾。分别的时候，我送给她一张合照，祝福她和家人一切都好。", "nghia": "Mary là người bạn thân nhất của tôi khi du học ở Trung Quốc, cô ấy thường giúp tôi luyện khẩu ngữ. Tháng trước mẹ cô ấy bị ốm, cô ấy buộc phải về nước sớm. Chúng tôi không thể cùng dự lễ tốt nghiệp, tôi thấy rất tiếc. Lúc chia tay, tôi tặng cô ấy một tấm ảnh chung và chúc cô ấy cùng gia đình mọi điều tốt đẹp.", "nhom": "Nhóm 3 · Bạn bè, tình cảm, chia tay", "g": 3}, {"k": "v9", "cau": "Câu 99", "dot": "Đề thật H51002", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["宿舍", "理解", "开心", "坦率", "帮助"], "mau": "刚上大学的时候，我和三个同学住在一个宿舍。大家的生活习惯不同，开始时常常有小矛盾。后来我们约定，有什么想法都要坦率地说出来。慢慢地，我们学会了互相理解、互相帮助。现在我们每天都过得很开心，成了最好的朋友。", "nghia": "Hồi mới vào đại học, tôi ở cùng phòng ký túc xá với ba bạn. Thói quen sinh hoạt mỗi người khác nhau nên lúc đầu hay có mâu thuẫn nhỏ. Sau đó chúng tôi thống nhất có suy nghĩ gì cũng phải nói thẳng ra. Dần dần, chúng tôi học được cách thấu hiểu và giúp đỡ nhau. Giờ ngày nào chúng tôi cũng rất vui và đã thành bạn thân nhất của nhau.", "nhom": "Nhóm 3 · Bạn bè, tình cảm, chia tay", "g": 3}, {"k": "v10", "cau": "Câu 99", "dot": "Đề mẫu chính thức HSK5", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["元旦", "放松", "礼物", "表演", "善良"], "mau": "今年元旦，我们班的同学去了一家养老院。我们给老人们准备了很多礼物，还表演了唱歌和跳舞。老人们看得很开心，我们也暂时放松了紧张的学习。一位善良的奶奶拉着我的手说，欢迎我们以后常来。这个元旦让我觉得特别有意义。", "nghia": "Tết Dương lịch năm nay, lớp tôi đến một viện dưỡng lão. Chúng tôi chuẩn bị nhiều quà cho các cụ, còn biểu diễn hát và múa. Các cụ xem rất vui, chúng tôi cũng tạm gác việc học căng thẳng để thư giãn. Một bà cụ hiền hậu nắm tay tôi nói mong chúng tôi sau này thường xuyên đến. Tết Dương lịch năm nay với tôi thật ý nghĩa.", "nhom": "Nhóm 3 · Bạn bè, tình cảm, chia tay", "g": 3}, {"k": "v3", "cau": "Câu 99", "dot": "Đề thật 13/01/2024", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["明星", "激动", "实在", "合影", "偶然"], "mau": "上个周末，我偶然在商场里遇到了我最喜欢的明星。我激动得说不出话来，心跳得特别快。我实在忍不住，就走过去问他能不能跟我合影。没想到他笑着答应了，还跟我聊了几句。这张照片我一直保存着，每次看到都觉得很幸福。", "nghia": "Cuối tuần trước, tôi tình cờ gặp thần tượng yêu thích nhất ở trung tâm thương mại. Tôi xúc động đến mức không nói nên lời, tim đập rất nhanh. Thật sự không kìm được, tôi đến hỏi anh ấy có thể chụp chung với tôi không. Không ngờ anh ấy cười đồng ý, còn nói chuyện với tôi vài câu. Tấm ảnh ấy tôi vẫn giữ, mỗi lần nhìn đều thấy rất hạnh phúc.", "nhom": "Nhóm 4 · Sở thích, giải trí, thần tượng, thú cưng", "g": 4}, {"k": "v11", "cau": "Câu 99", "dot": "Đề thật · sách 真题集, đề 4", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["奖金", "建筑", "围绕", "完美", "摄影"], "mau": "我的哥哥非常喜欢摄影。上个月他参加了一个城市建筑摄影比赛。为了拍出完美的照片，他围绕着那座古老的建筑走了很多圈，从早上一直拍到晚上。最后他的作品获得了一等奖，他打算用这笔奖金买一个更好的镜头。", "nghia": "Anh trai tôi rất thích nhiếp ảnh. Tháng trước anh ấy tham gia một cuộc thi ảnh kiến trúc thành phố. Để chụp được bức ảnh hoàn hảo, anh đi vòng quanh tòa kiến trúc cổ ấy rất nhiều vòng, chụp từ sáng đến tối. Cuối cùng tác phẩm của anh đạt giải nhất, anh định dùng tiền thưởng để mua một ống kính tốt hơn.", "nhom": "Nhóm 4 · Sở thích, giải trí, thần tượng, thú cưng", "g": 4}, {"k": "v12", "cau": "Câu 99", "dot": "Đề thật 09/04/2022", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["宠物", "地毯", "操心", "曾经", "不耐烦"], "mau": "我家养了一只小狗，它是我最喜欢的宠物。不过它很调皮，曾经把客厅的新地毯咬坏了。妈妈很生气，有点儿不耐烦地说要把它送人。我向妈妈保证会好好教它，以后不让她再操心。现在小狗已经变得很听话了。", "nghia": "Nhà tôi nuôi một chú chó nhỏ, đó là thú cưng tôi thích nhất. Nhưng nó rất nghịch, từng cắn hỏng tấm thảm mới ở phòng khách. Mẹ rất giận, có phần mất kiên nhẫn nói sẽ cho nó đi. Tôi hứa với mẹ sẽ dạy dỗ nó cẩn thận, sau này không để mẹ phải bận lòng nữa. Bây giờ chú chó đã trở nên rất ngoan.", "nhom": "Nhóm 4 · Sở thích, giải trí, thần tượng, thú cưng", "g": 4}, {"k": "v13", "cau": "Câu 99", "dot": "Đề thật 09/01/2022", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["国庆节", "愉快", "咨询", "提醒", "景色"], "mau": "今年国庆节，我和家人打算去杭州旅游。出发前，我打电话向旅行社咨询了路线和天气。工作人员提醒我们，节日期间人很多，最好提前订好酒店。到了杭州，西湖的景色非常美，我们度过了一个愉快的假期。", "nghia": "Quốc khánh năm nay, tôi và gia đình định đi du lịch Hàng Châu. Trước khi đi, tôi gọi điện hỏi công ty du lịch về lộ trình và thời tiết. Nhân viên nhắc chúng tôi dịp lễ rất đông người, tốt nhất nên đặt khách sạn trước. Đến Hàng Châu, cảnh Tây Hồ rất đẹp, chúng tôi đã có một kỳ nghỉ vui vẻ.", "nhom": "Nhóm 5 · Du lịch, ngày lễ, ăn uống", "g": 5}, {"k": "v14", "cau": "Câu 99", "dot": "Đề thật (nguồn không ghi ngày thi)", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["结账", "干脆", "感谢", "临时", "海鲜"], "mau": "上周末，几个老同学临时决定一起吃饭。因为大家都喜欢吃海鲜，我们就去了海边的一家餐厅。吃完饭准备结账的时候，大家都抢着付钱，最后小王干脆一个人把钱付了。我们都很感谢他，约好下次由我来请客。", "nghia": "Cuối tuần trước, mấy bạn học cũ đột xuất quyết định đi ăn cùng nhau. Vì ai cũng thích hải sản nên chúng tôi đến một nhà hàng ven biển. Ăn xong lúc chuẩn bị thanh toán, mọi người tranh nhau trả tiền, cuối cùng Tiểu Vương dứt khoát trả hết. Chúng tôi đều rất cảm ơn cậu ấy và hẹn lần sau tôi sẽ mời.", "nhom": "Nhóm 5 · Du lịch, ngày lễ, ăn uống", "g": 5}, {"k": "v15", "cau": "Câu 99", "dot": "Đề thật H51003", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["成立", "扩大", "信心", "服务", "谦虚"], "mau": "我的叔叔五年前成立了一家小公司，开始只有三个员工。他对顾客总是很谦虚，服务也非常周到，所以客人越来越多。今年公司又扩大了规模，员工增加到了五十多个。叔叔说，他对公司的未来充满信心。", "nghia": "Chú tôi thành lập một công ty nhỏ cách đây năm năm, lúc đầu chỉ có ba nhân viên. Chú luôn khiêm tốn với khách hàng, phục vụ cũng rất chu đáo nên khách ngày càng đông. Năm nay công ty lại mở rộng quy mô, nhân viên tăng lên hơn năm mươi người. Chú nói chú rất tự tin vào tương lai của công ty.", "nhom": "Nhóm 6 · Công việc, kinh doanh, tiêu dùng", "g": 6}, {"k": "v16", "cau": "Câu 99", "dot": "Đề thật (nguồn không ghi ngày thi)", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["简历", "信息", "突出", "特色", "应聘"], "mau": "大学毕业后，我开始找工作。我在网上看到一家公司的招聘信息，就决定去应聘。为了让简历更有特色，我把自己的实习经历和获得的奖项写得很清楚，突出了自己的优点。没想到一个星期后，我就收到了面试通知。", "nghia": "Tốt nghiệp đại học, tôi bắt đầu tìm việc. Tôi thấy thông tin tuyển dụng của một công ty trên mạng nên quyết định ứng tuyển. Để sơ yếu lý lịch có nét riêng, tôi viết rõ kinh nghiệm thực tập và các giải thưởng đã đạt, làm nổi bật ưu điểm của mình. Không ngờ một tuần sau tôi đã nhận được thông báo phỏng vấn.", "nhom": "Nhóm 6 · Công việc, kinh doanh, tiêu dùng", "g": 6}, {"k": "v17", "cau": "Câu 99", "dot": "Đề mẫu chính thức HSK5", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["制定", "逐渐", "消费", "实际", "比例"], "mau": "以前我花钱没有计划，每个月工资都不够用。后来我根据自己的实际情况，制定了一个消费计划，把吃饭、交通和娱乐的比例都定好。刚开始有点儿不习惯，但我逐渐养成了记账的习惯。现在我每个月都能存下一些钱了。", "nghia": "Trước đây tôi tiêu tiền không có kế hoạch, tháng nào lương cũng không đủ. Sau đó tôi dựa vào tình hình thực tế của mình, lập một kế hoạch chi tiêu, chia sẵn tỷ lệ cho ăn uống, đi lại và giải trí. Lúc đầu hơi chưa quen nhưng tôi dần hình thành thói quen ghi chép chi tiêu. Giờ tháng nào tôi cũng để dành được một ít tiền.", "nhom": "Nhóm 6 · Công việc, kinh doanh, tiêu dùng", "g": 6}, {"k": "v18", "cau": "Câu 99", "dot": "Đề thật 26/03/2022", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["评价", "改变", "完全", "个性", "有利"], "mau": "每个孩子都有自己的个性，父母不应该用同一个标准来评价他们。我的表妹性格很安静，以前父母总想改变她，让她变得活泼一些，结果她完全不开心。后来父母开始尊重她的选择，这对她的成长非常有利。现在她越来越自信了。", "nghia": "Mỗi đứa trẻ đều có cá tính riêng, bố mẹ không nên dùng cùng một tiêu chuẩn để đánh giá chúng. Em họ tôi tính rất trầm, trước đây bố mẹ luôn muốn thay đổi em cho hoạt bát hơn, kết quả em hoàn toàn không vui. Sau đó bố mẹ bắt đầu tôn trọng lựa chọn của em, điều này rất có lợi cho sự trưởng thành của em. Giờ em ngày càng tự tin.", "nhom": "Nhóm 7 · Tính cách, quan điểm, giáo dục", "g": 7}, {"k": "v19", "cau": "Câu 99", "dot": "Đề thật (thí sinh chia sẻ)", "de": "请结合下列词语（要全部使用，顺序不分先后），写一篇80字左右的短文。", "words": ["粮食", "气候", "人类", "积极", "发愁"], "mau": "粮食是人类生存最基本的条件。可是近年来全球气候变化越来越明显，很多地方不是干旱就是洪水，粮食产量受到了很大影响。一些贫穷国家的农民常常为吃饭发愁。我认为各国应该积极合作，共同保护环境，才能解决这个问题。", "nghia": "Lương thực là điều kiện cơ bản nhất để loài người tồn tại. Nhưng những năm gần đây biến đổi khí hậu toàn cầu ngày càng rõ rệt, nhiều nơi không hạn hán thì lũ lụt, sản lượng lương thực bị ảnh hưởng lớn. Nông dân ở một số nước nghèo thường xuyên lo không đủ ăn. Tôi cho rằng các nước nên tích cực hợp tác, cùng bảo vệ môi trường thì mới giải quyết được vấn đề này.", "nhom": "Nhóm 8 · Xã hội, môi trường", "g": 8}]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.replace(/[，。？！、,.?!\s“”"'：:；;]/g,'');
const KEY='hsk5-co-thao-v2';
let S={name:'',placed:{},fix:{},res:{},text:{}};
try{const t=JSON.parse(localStorage.getItem(KEY)||'null');if(t)S=Object.assign(S,t)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ITEMS={};D.secs.forEach(s=>s.groups.forEach(g=>g.items.forEach(it=>{it.sec=s.id;ITEMS[it.n]=it})));
const total=Object.keys(ITEMS).length;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}

function secStat(id){let ok=0,done=0;for(const it of Object.values(ITEMS))if(it.sec===id&&S.res[it.n]!=null){done++;if(S.res[it.n])ok++}return[ok,done]}
function renderScore(){
 let ok=0,done=0;for(const n in S.res){done++;if(S.res[n])ok++}
 $('#score').innerHTML='Đúng <b>'+ok+'</b> / '+done+' câu đã chấm <span style="font-weight:400;color:var(--mute)">(tổng '+total+')</span>';
 $('#meter').style.width=(done?ok/total*100:0)+'%';
 $('#nav').innerHTML=D.secs.map(s=>{const[o,d]=secStat(s.id);return '<a href="#'+s.id+'" class="'+(cur===s.id?'on':'')+'">'+esc(s.title)+(s.id==='viet'||s.guide?'':'<small>'+o+'/'+d+'</small>')+'</a>'}).join('');
}

function chipHTML(it,i){return '<button class="chip" data-n="'+it.n+'" data-i="'+i+'">'+esc(it.f[i])+'</button>'}
function feedback(it){
 const r=S.res[it.n];if(r==null)return '';
 const ans=it.k==='fix'?it.a.join(' / '):it.a[0];
 return '<div class="fb '+(r?'ok':'bad')+'"><div>'+(r?'Chính xác!':'Chưa đúng. Đáp án:')+'</div><div class="ans">'+esc(ans)+'</div>'+(it.v?'<div class="vi">'+esc(it.v)+'</div>':'')+'</div>';
}
function qHTML(it){
 const st=S.res[it.n]==null?'':(S.res[it.n]?' ok':' bad');
 let body;
 if(it.k==='order'){
  const p=S.placed[it.n]||[];
  body='<div class="slot" id="slot'+it.n+'">'+p.map(i=>chipHTML(it,i)).join('')+'</div><div class="bank">'+it.f.map((_,i)=>p.includes(i)?'':chipHTML(it,i)).join('')+'</div>';
 }else{
  body='<div class="wrong">'+esc(it.w)+'</div><input class="fix" data-n="'+it.n+'" value="'+esc(S.fix[it.n]||'')+'" placeholder="Gõ câu đúng vào đây" lang="zh">';
 }
 return '<div class="q'+st+'" id="q'+it.n+'"><div class="qh"><span class="num">'+it.n+'</span><span>'+esc(it.tag)+'</span></div>'+body+
  '<div class="act"><button class="main" data-check="'+it.n+'">Kiểm tra</button><button data-reset="'+it.n+'">Làm lại</button></div>'+feedback(it)+'</div>';
}
function grade(it){
 let v;
 if(it.k==='order'){const p=S.placed[it.n]||[];if(p.length<it.f.length)return false;v=p.map(i=>it.f[i]).join('')}
 else{v=S.fix[it.n]||'';if(!norm(v))return false}
 S.res[it.n]=it.a.some(a=>norm(a)===norm(v));return true;
}
function rerender(n){const it=ITEMS[n];const el=$('#q'+n);if(el)el.outerHTML=qHTML(it);renderScore();save()}

function vietHTML(){
 const groups=[...new Set(D.viet.map(v=>v.nhom))];
 let h='<div class="jump">'+groups.map((g,i)=>'<a href="#viet" data-jump="g'+i+'">'+esc(g.split(' · ')[1]||g)+'</a>').join('')+'</div>';
 let last='';
 D.viet.forEach(v=>{const k=v.k;
  if(v.nhom!==last){last=v.nhom;h+='<h2 class="nhom" id="g'+groups.indexOf(v.nhom)+'">'+esc(v.nhom)+'</h2>'}
  h+='<h3>'+esc(v.cau)+' · '+esc(v.dot)+'</h3><div class="paper"><div class="de">'+esc(v.de)+'</div>'+
  (v.words?'<div class="words" id="w'+k+'">'+v.words.map(w=>'<span class="w" data-w="'+esc(w)+'">'+esc(w)+'</span>').join('')+'</div>':'<p class="tranh">'+esc(v.tranh)+'</p>')+
  '<textarea data-t="'+k+'" lang="zh" placeholder="Viết bài của bạn ở đây...">'+esc(S.text[k]||'')+'</textarea>'+
  '<div class="count" id="c'+k+'"></div><div class="act"><button class="main" data-mau="'+k+'">Xem bài mẫu</button></div>'+
  '<div class="mau" id="m'+k+'"><div class="zh">'+esc(v.mau)+'</div><div class="vi" style="color:var(--mute);margin-top:6px">'+esc(v.nghia)+'</div></div></div>'});
 return h;
}
function updCount(k){
 const t=S.text[k]||'';const n=(t.match(/[一-鿿]/g)||[]).length;
 const v=D.viet.find(x=>x.k===k);let extra='';
 if(v.words){let used=0;document.querySelectorAll('#w'+k+' .w').forEach(e=>{const u=t.includes(e.dataset.w);e.classList.toggle('used',u);if(u)used++});extra=' · đã dùng <b>'+used+'/'+v.words.length+'</b> từ bắt buộc'}
 const c=$('#c'+k);if(c)c.innerHTML='Số chữ Hán: <b>'+n+'</b> (nên khoảng 80, không quá 100)'+extra;
}

let cur='';
function show(){
 cur=(location.hash||'').slice(1);if(!D.secs.some(s=>s.id===cur))cur=D.secs[0].id;
 const s=D.secs.find(x=>x.id===cur);
 let h='<h2 style="margin-top:8px">'+esc(s.title)+'</h2><p class="intro">'+esc(s.note)+'</p>';
 if(s.guide){h+=s.guide;$('#main').innerHTML=h;document.querySelectorAll('.pt td').forEach(c=>{c.dataset.l=c.closest('table').rows[0].cells[c.cellIndex].textContent});renderScore();return}
 if(s.id==='viet')h+=vietHTML();
 else{
  h+='<div class="tools"><button class="main" data-all="'+s.id+'">Chấm cả phần</button><button data-clear="'+s.id+'">Làm lại cả phần</button></div>';
  h+=s.groups.map(g=>(g.label?'<h2>'+esc(g.label)+'</h2>':'')+g.items.map(qHTML).join('')).join('');
 }
 $('#main').innerHTML=h;
 if(s.id==='viet')D.viet.forEach(v=>updCount(v.k))
 renderScore();
}

document.addEventListener('click',e=>{
 const j=e.target.closest('[data-jump]');if(j){e.preventDefault();const el=document.getElementById(j.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth'});return}
 const b=e.target.closest('button');if(!b)return;
 if(b.classList.contains('chip')){
  const n=+b.dataset.n,i=+b.dataset.i,p=S.placed[n]||(S.placed[n]=[]);
  const k=p.indexOf(i);if(k>=0)p.splice(k,1);else p.push(i);
  delete S.res[n];rerender(n);
  const nb=document.querySelector('#q'+n+' .bank .chip')||document.querySelector('#q'+n+' [data-check]');if(nb)nb.focus();
  return}
 if(b.dataset.check){const it=ITEMS[b.dataset.check];if(!grade(it)){toast(it.k==='order'?'Hãy ghép hết các cụm từ trước':'Hãy gõ câu trả lời trước');return}rerender(it.n);return}
 if(b.dataset.reset){const n=b.dataset.reset;delete S.placed[n];delete S.fix[n];delete S.res[n];rerender(n);return}
 if(b.dataset.all){let c=0,m=0;for(const it of Object.values(ITEMS))if(it.sec===b.dataset.all){if(grade(it))c++;else m++}save();show();toast('Đã chấm '+c+' câu'+(m?', còn '+m+' câu chưa làm':''));return}
 if(b.dataset.clear){for(const it of Object.values(ITEMS))if(it.sec===b.dataset.clear){delete S.placed[it.n];delete S.fix[it.n];delete S.res[it.n]}save();show();return}
 if(b.dataset.mau){const m=$('#m'+b.dataset.mau);m.classList.toggle('show');b.textContent=m.classList.contains('show')?'Ẩn bài mẫu':'Xem bài mẫu';return}
 if(b.id==='copy'){
  let ok=0,done=0;const sai=[];for(const n in S.res){done++;if(S.res[n])ok++;else sai.push(n)}
  const lines=['Luyện viết HSK5 – '+(S.name||'(chưa nhập tên)'),'Đúng '+ok+'/'+done+' câu đã chấm (tổng '+total+' câu)'];
  D.secs.forEach(s=>{if(s.id!=='viet'){const[o,d]=secStat(s.id);lines.push('- '+s.title+': '+o+'/'+d)}});
  if(sai.length)lines.push('Câu sai: '+sai.join(', '));
  D.viet.forEach(v=>{if(S.text[v.k])lines.push(v.cau+' ('+v.dot+'): '+S.text[v.k])});
  const txt=lines.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Đã copy, dán vào Zalo gửi cô nhé')).catch(()=>toast('Không copy được, hãy chụp màn hình gửi cô'));
 }
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.classList.contains('fix')){S.fix[t.dataset.n]=t.value;delete S.res[t.dataset.n];const q=$('#q'+t.dataset.n);q.classList.remove('ok','bad');const f=q.querySelector('.fb');if(f)f.remove();renderScore();save()}
 else if(t.dataset.t){S.text[t.dataset.t]=t.value;updCount(t.dataset.t);save()}
 else if(t.id==='ten'){S.name=t.value;save()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('fix')){const it=ITEMS[e.target.dataset.n];if(grade(it))rerender(it.n)}});
$('#ten').value=S.name||'';
addEventListener('hashchange',()=>{show();scrollTo(0,0)});
show();
}
</script>
</body>
</html>
