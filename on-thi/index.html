<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Trang Ôn thi HSK 3.0 (mở từ nút "Ôn thi" ở trang chủ). Chỉ học viên đã nhập mã (ct_trk_me) mới vào được.
     Mỗi cấp HSK1–6 có 4 mục: ① Tìm hiểu đề ② Luyện theo dạng ③ Thi thử ④ Xem tiến độ hiện tại.
     HSK3–6 có thêm bài thi Nói (口语, thay cho HSKK cũ). Dữ liệu: data.js. Lưu kết quả: ketqua.js (OTKQ.dang / OTKQ.thi). Tiến độ từng dạng / đề thi thử: ct_ot_<cấp>_<mã> = {best,first,n,last}. -->
<title>Ôn thi HSK – Cô Thảo tiếng Trung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
:root{
  --bg:#FBF7F1; --surface:#FFFFFF; --line:#E6D8C8;
  --fg:#2B1A1F; --muted:#76656A; --plum:#7A1F3D; --plum-soft:#F3E3E8;
  --gold:#B8862A; --gold-soft:#F7EBD2; --ok:#2F7A4F; --ok-soft:#E3F2E8; --no:#B23B3B;
  --f-display:"Noto Serif SC","Songti SC",serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65}
.zh{font-family:var(--f-zh)}
#app{display:flex;flex-direction:column;gap:14px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px;display:flex;flex-direction:column;gap:18px}
.back{align-self:flex-start;color:var(--plum);font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px}
.back:hover,.back:focus-visible{border-color:var(--plum);outline:none}
.head{display:flex;gap:18px;align-items:center}
.seal{flex:none;width:76px;height:96px;border-radius:10px;background:linear-gradient(160deg,var(--plum),#2a0a17);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:5px solid var(--gold);box-shadow:0 6px 16px rgba(0,0,0,.2)}
.seal .zh{font-family:var(--f-display);font-size:26px;color:var(--gold);line-height:1.1}
.seal small{font-size:10px;opacity:.85}
.head h1{margin:0;font-size:26px;color:var(--plum);line-height:1.25}
.head p{margin:4px 0 0;color:var(--muted)}
.me{font-size:13px;color:var(--muted)}
.me b{color:var(--plum)}
/* chọn cấp */
.lvs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.lv{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;font:inherit;color:inherit;line-height:1.25}
.lv b{display:block;font-size:17px;color:var(--plum)}
.lv small{font-size:11px;color:var(--muted)}
.lv:hover,.lv:focus-visible{border-color:var(--plum);outline:none}
.lv.on{background:var(--plum);border-color:var(--plum)}
.lv.on b,.lv.on small{color:#fff}
.lv .mic{display:inline-block;font-size:10px;font-weight:700;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:0 6px;margin-top:2px}
.lv.on .mic{background:var(--gold);color:#fff}
/* tóm tắt cấp */
.sum{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px}
.chip b{color:var(--plum)}
/* tab 4 mục */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 0}
.tab{border:0;border-bottom:3px solid var(--line);background:none;font:600 14px var(--f-body);color:var(--muted);padding:8px 4px;cursor:pointer;text-align:center}
.tab.on{color:var(--plum);border-color:var(--plum)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pane{display:flex;flex-direction:column;gap:14px}
h2{margin:6px 0 0;font-size:19px;color:var(--plum);display:flex;align-items:center;gap:10px}
h2 .num{flex:none;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--plum);color:#fff;display:grid;place-items:center;font-size:13px}
.hint{margin:-6px 0 0;color:var(--muted);font-size:14px}
/* bảng cấu trúc đề */
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--plum-soft);color:var(--plum);font-weight:700}
td.k{white-space:nowrap;font-weight:700;color:var(--plum)}
td.c{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
tr.sk td{background:var(--gold-soft);font-weight:700;color:var(--gold)}
/* thẻ dạng */
.list{display:flex;flex-direction:column;gap:10px}
.de{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
a.de:hover,a.de:focus-visible{border-color:var(--plum);transform:translateY(-2px);outline:none}
.code{min-width:72px;font-weight:700;color:var(--plum);background:var(--plum-soft);border-radius:8px;padding:6px 10px;text-align:center;line-height:1.3}
.code small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.de b{display:block;font-size:15px}
.de p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tag{display:inline-block;background:var(--gold-soft);color:var(--gold);border-radius:999px;padding:0 8px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:1px}
.go{color:var(--plum);font-weight:700;white-space:nowrap}
.de.soon{opacity:.62}
.de.soon .go{color:var(--muted);font-weight:500}
.grp{font-size:15px;font-weight:700;margin:4px 0 -4px;display:flex;align-items:center;gap:8px}
.grp small{font-weight:500;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box.gold{background:var(--gold-soft);border-color:#ead6a8}
.box p{margin:0 0 6px}.box p:last-child{margin:0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.flow span{background:var(--plum-soft);color:var(--plum);border-radius:8px;padding:2px 8px;font-weight:600}
.pct{font-weight:700;font-variant-numeric:tabular-nums}
.lan{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.pct.ok{color:var(--ok)}.pct.no{color:var(--no)}.pct.na{color:var(--muted);font-weight:500}
/* khóa */
.lock{text-align:center;padding:30px 18px;display:flex;flex-direction:column;gap:10px;align-items:center}
.lock .ic{font-size:44px}
.btn{display:inline-block;background:var(--plum);color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:10px 22px}
.btn.o{background:none;color:var(--plum);border:1px solid var(--plum)}
.note{color:var(--muted);font-size:13px}
.vd{display:block;font-family:var(--f-zh);font-size:13px;color:var(--fg);opacity:.8;margin-top:2px}
.vd::before{content:"VD đề mẫu: ";font-family:var(--f-body);color:var(--muted);opacity:1}
.dw{display:flex;flex-direction:column;gap:0}
.dw.need .de{border-color:#e7b9b9;border-bottom-left-radius:0;border-bottom-right-radius:0}
.onl{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FBEDED;border:1px solid #e7b9b9;border-top:0;border-radius:0 0 14px 14px;padding:7px 16px;font-size:13px;color:var(--no);text-decoration:none;font-weight:600}
.onl:hover,.onl:focus-visible{background:#F7E0E0;outline:none}
.mini{display:inline-block;font-size:12px;font-weight:700;color:var(--plum);border:1px solid var(--plum);border-radius:999px;padding:1px 10px;text-decoration:none;margin-left:6px;white-space:nowrap}
@media (max-width:620px){
 .lvs{grid-template-columns:repeat(3,minmax(0,1fr))}
 .de{grid-template-columns:auto minmax(0,1fr)}.go{grid-column:2}
 .head h1{font-size:22px}
 .tab{font-size:13px}
 th,td{padding:7px 8px}
}
@media (prefers-reduced-motion:reduce){.de{transition:none}a.de:hover{transform:none}}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../">← Trang cô Thảo tiếng Trung</a>
  <div class="head">
    <div class="seal"><span class="zh">考试</span><small>HSK 3.0</small></div>
    <div><h1>Ôn thi HSK</h1><p>Ôn theo đề HSK mới (3.0) – thi từ 13/12/2026. HSK 3–6 có thêm bài thi Nói.</p><div class="me" id="me"></div></div>
  </div>
  <div id="app"></div>
  <p class="note">Ôn thi dành cho học viên đang học với cô Thảo. Kết quả lưu trên máy của em và gửi về sổ theo dõi của cô.</p>
</main>
<script src="data.js?v=2"></script>
<script src="ketqua.js?v=1"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const J=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const ME=J("ct_trk_me",null);
const app=$("app");

/* ---------- Chưa có mã: khóa ---------- */
if(!ME){
  app.innerHTML=`<div class="box lock"><div class="ic">🔒</div><b style="font-size:18px;color:var(--plum)">Mục Ôn thi dành cho học viên của cô Thảo</b>
  <p class="note" style="margin:0">Em quay lại trang chủ, bấm <b>Nhập mã học viên</b>, nhập mã cô cấp rồi bấm lại nút <b>Ôn thi</b>.</p>
  <a class="btn" href="../#ma">🔑 Nhập mã học viên</a><a class="btn o" href="https://zalo.me/0366534081">Chưa có mã? Nhắn Zalo cô</a></div>`;
  return;
}
$("me").innerHTML=`👤 <b>${esc(ME.name)}</b>${ME.cls?" · "+esc(ME.cls):""}`;

const TABS=[["de","① Tìm hiểu đề"],["dang","② Luyện theo dạng"],["thi","③ Thi thử"],["td","④ Xem tiến độ hiện tại"]];
let st=J("ct_ot_ui",{lv:1,tab:"de"});
const m=/^#hsk([1-6])(?:\/(de|dang|thi|td))?$/.exec(location.hash);
if(m){st.lv=+m[1];if(m[2])st.tab=m[2]}

const allDang=L=>{const o=[];L.sec.forEach(s=>s[2].forEach(d=>o.push({...d,sk:s[0]})));if(L.noi)L.noi.d.forEach(d=>o.push({...d,sk:"Nói"}));return o};
const prog=(lv,k)=>J(`ct_ot_${lv}_${k}`,null);

function draw(){
  const lv=st.lv,L=OT[lv];put("ct_ot_ui",st);
  history.replaceState(null,"",`#hsk${lv}/${st.tab}`);
  let h=`<div class="lvs" role="tablist" aria-label="Chọn cấp">${[1,2,3,4,5,6].map(i=>`<button class="lv ${i==lv?"on":""}" role="tab" aria-selected="${i==lv}" data-lv="${i}"><b>HSK${i}</b><small>${OT[i].ten}</small>${OT[i].noi?`<br><span class="mic">+ Nói</span>`:""}</button>`).join("")}</div>`;
  h+=`<div class="sum"><span class="chip">Bài viết: <b>${L.n} câu</b> · ${L.t} phút</span>${L.sec.map(s=>`<span class="chip">${s[0]} ${s[2].reduce((a,d)=>a+cnt(d.c),0)} câu · ${s[1]}'</span>`).join("")}${L.noi?`<span class="chip">🎤 Nói ~${L.noi.t} phút</span>`:""}<span class="chip">Từ vựng: <b>${L.tu.toLocaleString("vi")}</b> từ</span></div>`;
  h+=`<div class="tabs" role="tablist">${TABS.map(t=>`<button class="tab ${t[0]==st.tab?"on":""}" role="tab" aria-selected="${t[0]==st.tab}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>`;
  h+=`<div class="pane">${({de:paneDe,dang:paneDang,thi:paneThi,td:paneTd})[st.tab](lv,L)}</div>`;
  app.innerHTML=h;
}
const cnt=c=>{const r=/^(\d+)–(\d+)$/.exec(c||"");return r?(+r[2]-+r[1]+1):(/^\d+$/.test(c||"")?1:0)};

/* ① Tìm hiểu đề */
function paneDe(lv,L){
  let h=`<h2><span class="num">Viết</span>Bài thi viết (笔试) · ${L.n} câu · ~${L.t} phút</h2>
  <table><thead><tr><th>Phần</th><th>Câu</th><th>Dạng bài</th></tr></thead><tbody>`;
  L.sec.forEach(s=>{h+=`<tr class="sk"><td colspan="3">${s[0]} · ${s[2].reduce((a,d)=>a+cnt(d.c),0)} câu · ${s[1]} phút</td></tr>`;
    s[2].forEach(d=>h+=`<tr><td class="k">${esc(d.p)}</td><td class="c">${esc(d.c)}</td><td>${esc(d.d)}${d.vd?`<span class="vd">${esc(d.vd)}</span>`:""}</td></tr>`)});
  h+=`</tbody></table>
  <div class="box"><p><b>Thang điểm:</b> Hán khảo quốc tế (CTI) chưa công bố thang điểm chính thức cho đề 3.0. Trên web, mỗi dạng và mỗi đề thi thử tính theo <b>%</b>; <b>đạt khi từ 80%</b>. Cô sẽ cập nhật thang điểm khi có thông báo chính thức.</p>
  <p class="note">Kỳ thi HSK 3.0 chính thức đầu tiên (HSK1–6): <b>13/12/2026</b>. Em nhớ hỏi điểm thi xem kỳ mình đăng ký là đề 3.0 hay đề cũ 2.0.</p></div>`;
  if(L.noi){h+=`<h2><span class="num">Nói</span>Bài thi nói (口语) · ~${L.noi.t} phút${L.noi.cb?` (gồm ${L.noi.cb} phút chuẩn bị)`:""}</h2>
  <p class="hint">Theo đề 3.0, từ HSK3 trở lên có bài thi Nói theo đúng cấp (口语三级–六级), đăng ký cùng bài viết – thay cho HSKK sơ / trung / cao cấp trước đây.</p>
  <table><thead><tr><th>Phần</th><th>Số câu</th><th>Dạng bài</th></tr></thead><tbody>${L.noi.d.map(d=>`<tr><td class="k">${esc(d.p)}</td><td class="c">${esc(d.c||"–")}</td><td>${esc(d.d)}${d.vd?`<span class="vd">${esc(d.vd)}</span>`:""}${d.x?`<span class="note" style="display:block">${esc(d.x)}</span>`:""}</td></tr>`).join("")}</tbody></table>${L.noi.x?`<p class="note" style="margin:0">${esc(L.noi.x)}</p>`:""}`}
  else h+=`<div class="box"><p>HSK${lv} không có bài thi Nói. Phần thi nói bắt đầu từ HSK3.</p></div>`;
  h+=`<h2><span class="num">💡</span>Mẹo làm bài của cô</h2>${TIP[lv]?`<div class="box gold">${TIP[lv]}</div>`:`<div class="box"><p class="note">Cô đang soạn mẹo cho từng phần của HSK${lv}.</p></div>`}`;
  return h;
}
/* ② Luyện theo dạng */
const onl=(d,lv)=>d.on?{t:d.ont||"Bài liên quan",href:d.on}:ONL[lv];
const card=(d,lv)=>{const p=prog(lv,d.k),on=!!d.href,need=p&&p.best<80,o=need&&onl(d,lv);
  return `<div class="dw ${need?"need":""}"><${on?"a":"div"} class="de ${on?"":"soon"}" ${on?`href="${esc(d.href)}"`:'aria-disabled="true"'}>
  <span class="code">${esc(d.sk)} ${esc(d.p.replace("Phần ",""))}<small>${d.c?(/câu/.test(d.c)?esc(d.c):"Câu "+esc(d.c)):"&nbsp;"}</small></span>
  <span><b>${esc(d.d)}${p?`<span class="tag" style="${need?"background:#FBEDED;color:var(--no)":""}">${p.best}%</span>`:""}</b>${d.vd?`<span class="vd">${esc(d.vd)}</span>`:""}${d.x?`<p>${esc(d.x)}</p>`:""}</span>
  <span class="go">${on?(need?"Làm lại →":"Luyện →"):"Sắp ra mắt"}</span></${on?"a":"div"}>${o?`<a class="onl" href="${esc(o.href)}"><span>Dưới 80% – ôn lại trước khi làm tiếp</span><span>📘 ${esc(o.t)} →</span></a>`:""}</div>`};
function paneDang(lv,L){
  let h=`<p class="hint" style="margin:0">Mỗi dạng: <b>Mẹo nhận dạng → Luyện câu mẫu → 📝 Test nhanh → 📈 Xem tiến độ</b>. Đạt khi từ 80% trở lên; chưa đạt thì làm lại câu sai. Câu sai tự vào mục <b>Lỗi sai</b> và sổ theo dõi của cô; dạng dưới 80% có nút ôn lại bài liên quan.</p>`;
  L.sec.forEach(s=>{h+=`<div class="grp">${{Nghe:"🎧",Đọc:"📖",Viết:"✍️"}[s[0]]} ${s[0]} <small>${s[2].length} dạng</small></div><div class="list">${s[2].map(d=>card({...d,sk:s[0]},lv)).join("")}</div>`});
  if(L.noi){h+=`<div class="grp">🎤 Nói <small>${L.noi.d.length} dạng</small></div>
  <div class="box gold flow"><span>Nghe / xem đề</span>→<span>Đồng hồ chuẩn bị</span>→<span>Ghi âm</span>→<span>Nộp cô chấm</span>→<span>Xem câu trả lời mẫu (bật/tắt pinyin)</span></div>
  <p class="note" style="margin:-6px 0 0">Bài ghi âm tốt cô gom vào <b>kho video luyện nói</b> của từng bạn.</p>
  <div class="list">${L.noi.d.map(d=>card({...d,sk:"Nói"},lv)).join("")}</div>`}
  return h;
}
/* ③ Thi thử */
function paneThi(lv,L){
  const T=THI[lv]||[];
  let h=`<div class="box"><p><b>Thi thử full đề HSK${lv} (3.0)</b>: ${L.n} câu · ${L.t} phút${L.noi?` + Nói ~${L.noi.t} phút`:""}. Có đồng hồ, hết giờ máy tự nộp. Điểm từng phần gửi về sổ theo dõi của cô.</p>
  <p><b>Làm lại đến khi đạt:</b> dưới 80% thì chưa mở đáp án – em làm lại các câu sai (lần 2, 3…) đến khi đạt. Câu sai được đưa vào mục <b>Lỗi sai</b>.</p></div>`;
  const moi=T.filter(x=>x.tag!="Đề 2.0"),cu=T.filter(x=>x.tag=="Đề 2.0");
  h+=`<div class="list">${moi.length?moi.map(x=>thiCard(x)).join(""):`<div class="de soon"><span class="code">Đề 1<small>3.0</small></span><span><b>Đề thi thử HSK${lv} số 1</b><p>Đề theo cấu trúc mới, cô đang soạn.</p></span><span class="go">Sắp ra mắt</span></div>`}</div>`;
  if(cu.length)h+=`<div class="grp">📚 Ôn đề cũ (dạng 2.0) <small>vẫn dùng để luyện từ vựng, đọc, viết</small></div><div class="list">${cu.map(x=>thiCard(x)).join("")}</div>`;
  return h;
}
const thiCard=x=>{const p=x.k?prog(st.lv,x.k):null;return `<a class="de" href="${esc(x.href)}"><span class="code">Đề<small>${esc(x.tag||"3.0")}</small></span><span><b>${esc(x.t)}${p?`<span class="tag" style="${p.best<80?"background:#FBEDED;color:var(--no)":""}">${p.best}%</span>`:""}</b><p>${esc(x.d)}</p></span><span class="go">${p&&p.best<80?"Làm lại →":"Mở →"}</span></a>`};
/* ④ Xem tiến độ hiện tại */
function paneTd(lv,L){
  const D=allDang(L);let lam=0,dat=0;
  const rows=D.map(d=>{const p=prog(lv,d.k);if(p){lam++;if(p.best>=80)dat++}
    return `<tr><td class="k">${esc(d.sk)} ${esc(d.p.replace("Phần ",""))}</td><td>${esc(d.d)}</td><td>${p?`<span class="pct ${p.best>=80?"ok":"no"}">${p.best}%</span><small class="lan">${p.n} lần · lần 1: ${p.first}%</small>${p.best<80?`<a class="mini" style="margin:2px 0 0" href="${esc(onl(d,lv).href)}">Ôn lại</a>`:""}`:`<span class="pct na">Chưa làm</span>`}</td></tr>`}).join("");
  const yeu=D.map(d=>({d,p:prog(lv,d.k)})).filter(x=>x.p&&x.p.best<80).sort((a,b)=>a.p.best-b.p.best).slice(0,3);
  const T=(THI[lv]||[]).filter(x=>x.k).map(x=>({x,p:prog(lv,x.k)}));
  return `<div class="sum"><span class="chip">Đã luyện <b>${lam}/${D.length}</b> dạng</span><span class="chip">Đạt (≥80%) <b>${dat}</b></span></div>
  ${yeu.length?`<div class="box gold"><p><b>Dạng yếu nhất:</b> ${esc(yeu[0].d.sk)} ${esc(yeu[0].d.p.replace("Phần ",""))} – ${esc(yeu[0].d.d)} (<span class="pct no">${yeu[0].p.best}%</span>)<a class="mini" href="${esc(onl(yeu[0].d,lv).href)}">📘 Ôn lại</a></p>${yeu.length>1?`<p class="note">Cần ôn tiếp: ${yeu.slice(1).map(x=>`${esc(x.d.sk)} ${esc(x.d.p.replace("Phần ",""))} (${x.p.best}%)`).join(" · ")}</p>`:""}</div>`:""}
  <h2><span class="num">1</span>Điểm theo từng dạng</h2>
  <table><thead><tr><th>Dạng</th><th>Nội dung</th><th>Điểm tốt nhất</th></tr></thead><tbody>${rows}</tbody></table>
  <h2><span class="num">2</span>Điểm thi thử</h2>
  ${T.length?`<table><thead><tr><th>Đề</th><th>Điểm tốt nhất</th></tr></thead><tbody>${T.map(({x,p})=>`<tr><td>${esc(x.t)}</td><td>${p?`<span class="pct ${p.best>=80?"ok":"no"}">${p.best}%</span><small class="lan">${p.n} lần · lần 1: ${p.first}%</small>`:`<span class="pct na">Chưa làm</span>`}</td></tr>`).join("")}</tbody></table>`:`<div class="box"><p class="note">Đề thi thử HSK${lv} (3.0) cô đang soạn. Có đề là điểm hiện ở đây.</p></div>`}
  ${lam?"":`<p class="note" style="margin:0">Em chưa luyện dạng nào của HSK${lv}. Vào ② Luyện theo dạng để bắt đầu.</p>`}`;
}

app.addEventListener("click",e=>{const b=e.target.closest("[data-lv],[data-tab]");if(!b)return;
  if(b.dataset.lv){st.lv=+b.dataset.lv}else st.tab=b.dataset.tab;draw();
  if(b.dataset.tab)document.querySelector(".tabs").scrollIntoView({block:"nearest"})});
window.addEventListener("hashchange",()=>{const m=/^#hsk([1-6])(?:\/(de|dang|thi|td))?$/.exec(location.hash);if(m){st.lv=+m[1];if(m[2])st.tab=m[2];draw()}});
draw();
})();
</script>
</body>
</html>
